<!DOCTYPE html>
<html lang="zh-CN" data-town-root="..">
<head><link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2"><link rel="manifest" href="../manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="动物小镇"><meta name="theme-color" content="#fff6ea">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面包店 · 开店做点心</title>
<link rel="icon" href="../assets/icon.png">
<style>
:root{--ink:#4A2E2A;--soft:#9A7B72;--pink:#F28BA8;--pink-d:#D9607F;--cream:#FFF8EE;--line:#F1D9C8;--mint:#7FD1B9;--mint-d:#4FAF93;--gold:#F6C15B;
 --font:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;overflow:hidden;
 background:#FBE3E3 url(../assets/bakery_bg.jpg) center/cover no-repeat fixed}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 45%,rgba(255,248,240,0) 35%,rgba(120,60,50,.18) 100%)}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:14px 22px;overflow-y:auto}
.screen.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,250,244,.96);border-radius:999px;padding:9px 18px;font-weight:900;font-size:18px;box-shadow:0 3px 0 #E8C3B5}
.big{font-size:23px;font-weight:900;border-radius:999px;padding:15px 34px;transition:transform .08s}
.big:active{transform:translateY(4px)}
.pink{background:linear-gradient(#F79DB5,#E9718F);color:#fff;box-shadow:0 6px 0 #B94D6A}
.mint{background:linear-gradient(#8EDDC5,#5DBB9F);color:#fff;box-shadow:0 6px 0 #3E8C75}
.white{background:#FFFBF5;box-shadow:0 6px 0 #E3C2B3}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
h1{font-size:40px;margin:0;font-weight:900}
.muted{color:var(--soft)}
.panel{background:linear-gradient(#FFFDF9,#FFF5EC);border-radius:28px;box-shadow:0 0 0 3px #F0C3B3,0 0 0 9px rgba(255,250,244,.75),0 18px 50px rgba(110,50,40,.25);position:relative}
.panel::before{content:'';position:absolute;left:24px;right:24px;top:-16px;height:22px;border-radius:12px 12px 4px 4px;
 background:repeating-linear-gradient(90deg,#F28BA8 0 34px,#FFF5EE 34px 68px);box-shadow:0 3px 4px rgba(0,0,0,.12)}
.sign{display:inline-flex;align-items:center;gap:10px;background:#7A4A3A;color:#FFE9C9;font-size:36px;font-weight:900;letter-spacing:8px;padding:8px 22px 8px 30px;border-radius:14px;box-shadow:inset 0 0 0 4px #FFE9C9,inset 0 0 0 6px #7A4A3A,0 6px 0 #4E2D22}
/* home */
#homePanel{width:min(760px,64vw);margin:4vh auto 0;padding:34px 30px 30px}
.case{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;background:linear-gradient(#FFF,#FCEFE7);border-radius:18px;padding:12px;box-shadow:inset 0 0 0 3px #F2D2C4}
.case div{aspect-ratio:1;border-radius:12px;background:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;box-shadow:0 3px 0 #F0D6CA;position:relative}
.case div small{font-size:12px;font-weight:900;color:var(--soft)}
.case div.lock{filter:grayscale(1);opacity:.35}
.case div.new::after{content:'NEW';position:absolute;top:-8px;right:-6px;background:var(--pink);color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:2px 5px}
.modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mode{background:#FFF;border-radius:18px;padding:12px 16px;min-width:150px;box-shadow:0 4px 0 #F0D6CA;font-weight:900;font-size:17px}
.mode small{display:block;font-weight:700;color:var(--soft);font-size:13px;margin-top:2px}
.mode.soon{opacity:.5}
/* play */
#stageWrap{width:min(1000px,76vw);margin:0 auto;padding:26px 26px 26px;max-height:calc(100vh - 70px);overflow-y:auto;overscroll-behavior:contain}
.order{display:flex;align-items:center;gap:16px;background:#FFF;border-radius:22px;padding:12px 18px;box-shadow:0 4px 0 #F0D6CA;max-width:820px}
.order .cust{width:84px;height:84px;border-radius:50%;background:#FFF;box-shadow:0 0 0 4px #FCE3EA;position:relative;overflow:hidden;flex:none}
.order .cust i{position:absolute;inset:0;background-repeat:no-repeat}
.order .say{font-size:25px;font-weight:900;text-align:left;line-height:1.35}
.order .say b{color:var(--pink-d);font-size:30px}
.speak{width:52px;height:52px;border-radius:50%;background:#FFF0F4;font-size:24px;flex:none}
/* tray */
.tray{display:inline-grid;gap:6px;padding:14px;border-radius:14px;background:linear-gradient(#C9CDD3,#AEB3BA);box-shadow:inset 0 0 0 4px #9AA0A8,0 6px 0 #7D838B}
.tray .slot{width:var(--s,46px);height:var(--s,46px);border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s,46px)*.74);line-height:1}
.tray .slot.on{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2)}}
.rowlab{display:flex;flex-direction:column;gap:6px;padding:14px 0;justify-content:flex-start}
.rowlab span{height:var(--s,46px);display:flex;align-items:center;font-weight:900;color:var(--pink-d);font-size:22px;min-width:44px}
/* boxes */
.pile{display:flex;flex-wrap:wrap;gap:4px;max-width:560px;justify-content:center;min-height:52px;font-size:34px}
.boxes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.box{width:130px;min-height:120px;border-radius:12px;background:linear-gradient(#FFE1EA,#FFC8D8);box-shadow:inset 0 0 0 4px #F5A3BA,0 5px 0 #D9849C;padding:8px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;justify-content:center;font-size:26px;cursor:pointer;position:relative}
.box::before{content:'';position:absolute;left:50%;top:-10px;width:40px;height:14px;transform:translateX(-50%);border-radius:8px 8px 0 0;background:#F5A3BA}
.box .n{position:absolute;bottom:-28px;left:0;right:0;font-weight:900;color:var(--pink-d);font-size:18px}
/* number pad */
.ans{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:900}
.ans .q{font-size:36px}
.ans .box2{min-width:110px;height:68px;border-radius:16px;background:#FFF;box-shadow:inset 0 0 0 3px #F0C3B3;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--pink-d)}
.pad{display:grid;grid-template-columns:repeat(6,64px);gap:10px}
.pad button{height:60px;border-radius:16px;background:#FFF;font-size:28px;font-weight:900;box-shadow:0 4px 0 #EBCFC2}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #EBCFC2}
.pad .ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-d)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border-radius:50%;background:#F2DCD2}.dots i.ok{background:var(--mint)}.dots i.cur{background:var(--pink)}.dots .chal{margin-left:10px;background:linear-gradient(90deg,#FFD66B,#FF9FB6);color:#7A3B12;font-weight:900;border-radius:999px;padding:3px 12px;font-size:15px;animation:popin .5s}
.burst{position:fixed;pointer-events:none;font-size:30px;z-index:200;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.hint{font-size:18px;font-weight:800;color:var(--soft)}

.split{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;width:100%;align-items:start;margin-top:14px}
.split .left{background:rgba(255,255,255,.6);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 3px #F6DCD0;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:320px;justify-content:center}
.split .right{display:flex;flex-direction:column;align-items:center;gap:12px}
.eq.eqs{font-size:22px;letter-spacing:0;color:var(--soft);max-width:320px;text-align:center}
.eq{font-size:44px;font-weight:900;letter-spacing:3px;color:#5A3A30}
.bin{display:flex;align-items:center;gap:12px}
.src{width:76px;height:76px;border-radius:50%;background:radial-gradient(#FFF,#FDE6EC);box-shadow:0 0 0 4px #F7BACB,0 5px 0 #E59AB0;font-size:46px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.05)}}
.binlab{font-size:15px;font-weight:800;color:var(--soft);text-align:left}
.tray .slot{cursor:pointer}.tray .slot.hover{background:rgba(255,255,255,.75);box-shadow:0 0 0 3px #F28BA8}
.counter{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:900}
.counter b{color:var(--pink-d);font-size:26px}
.mini{background:#FFF;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:900;box-shadow:0 3px 0 #EBCFC2}
.flyer{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%);font-size:34px;line-height:1}
.flyer.drag{font-size:46px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.pile .it{cursor:grab;touch-action:none;display:inline-block;transition:transform .15s}.pile .it:hover{transform:scale(1.2)}
.pile .it.gone{visibility:hidden}
.tt{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;background:url(../assets/treats.webp) 0 0/400% 300% no-repeat}
.box{min-height:110px;width:118px;flex-direction:column}.box .in{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;width:100%}
.box .n{position:static;margin-top:auto}.box.hover{transform:scale(1.06);box-shadow:inset 0 0 0 4px #E9718F,0 5px 0 #D9849C}
.pad{grid-template-columns:repeat(3,70px)}
/* bakery home scene */
#home{padding:0;background:#F3D6D8}
#home.on{display:flex;align-items:center;justify-content:center}
#scene{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;margin:auto;overflow:hidden;background:#F8DDE0 url(../assets/bakery_bg.jpg) center/100% 100% no-repeat;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
#scene .hud{position:absolute;left:1.2%;right:1.2%;top:2%;display:flex;gap:10px;align-items:center;z-index:4}
.st{position:absolute;cursor:pointer;border-radius:18px;transition:background .2s}
.st:hover{background:rgba(255,255,255,.18);box-shadow:0 0 0 4px rgba(255,255,255,.6)}
.st .lab{position:absolute;left:50%;transform:translate(-50%,-50%);font-weight:900;color:#5A3A1E;white-space:nowrap;font-size:calc(min(100vw,100vh*1.777)*.019);letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,255,255,.6);pointer-events:none}
.st.soon{cursor:help}
.st .tag{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(255,251,245,.95);border-radius:999px;padding:6px 14px;font-weight:900;font-size:calc(min(100vw,100vh*1.777)*.0105);box-shadow:0 3px 0 #E3C2B3;white-space:nowrap}
.st.soon .tag{opacity:.75}
#caseBar{position:absolute;left:1.5%;bottom:3%;display:flex;gap:6px;background:rgba(255,251,245,.92);border-radius:18px;padding:8px 12px;box-shadow:0 0 0 3px #F0C3B3,0 6px 18px rgba(90,40,20,.2);z-index:4}
#caseBar div{width:calc(min(100vw,100vh*1.777)*.034);aspect-ratio:1;border-radius:10px;background:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(min(100vw,100vh*1.777)*.019);box-shadow:0 2px 0 #F0D6CA;position:relative}
#caseBar div small{font-size:10px;font-weight:900;color:var(--soft)}
#caseBar div.lock{filter:grayscale(1);opacity:.35}
#caseBar .cl{font-weight:900;font-size:14px;align-self:center;margin-right:4px;width:auto;background:none;box-shadow:none;aspect-ratio:auto}
.bubble{position:absolute;transform:translate(-50%,-110%);background:#FFFBF5;border-radius:16px;padding:10px 16px;font-weight:800;font-size:17px;box-shadow:0 0 0 3px #F0C3B3,0 6px 16px rgba(0,0,0,.15);z-index:6;white-space:nowrap;animation:fade .25s}

.digital{font-family:"SF Mono",ui-monospace,monospace;font-weight:900;font-size:44px;color:#5A3A30;background:#2F2A2A;color:#9FF2C8;border-radius:12px;padding:4px 16px;letter-spacing:2px}
.clock{width:min(300px,28vw);height:min(300px,28vw);touch-action:none;cursor:grab;filter:drop-shadow(0 6px 8px rgba(90,40,20,.2))}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topt{background:#FFF;border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 #EBCFC2;display:flex;flex-direction:column;align-items:center;gap:6px}
.topt .digital{font-size:30px}.topt small{font-size:16px;font-weight:900;color:var(--soft)}
.topt.right,.fopt.right,.cakebtn.right{box-shadow:0 0 0 4px var(--mint),0 4px 0 var(--mint-d)}
.topt.wrong,.fopt.wrong,.cakebtn.wrong{animation:shake .4s;opacity:.5}
.cake .sl{stroke:#FFF;stroke-width:3.5;stroke-linejoin:round;cursor:pointer;transition:transform .25s,filter .2s}
.cake .sl.sel{stroke:#F06A92;stroke-width:5;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}.cake .sl:hover{filter:brightness(1.08)}.cake .sl.taken{opacity:.25}
.cakes2{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.cakebtn{background:#FFF;border-radius:20px;padding:10px;box-shadow:0 4px 0 #EBCFC2;display:flex;flex-direction:column;align-items:center;gap:6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-weight:900;margin:0 4px}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 4px 2px}.frac span:last-child{padding-top:2px}
.fopts{display:grid;grid-template-columns:repeat(2,96px);gap:12px}
.fopt{background:#FFF;border-radius:18px;height:96px;font-size:34px;box-shadow:0 4px 0 #EBCFC2;color:#5A3A30}
.order .say .frac{font-size:26px;color:var(--pink-d)}
/* parent */
#parent{background:#FBF8F4}
.pc{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 0 #EEE;user-select:text;-webkit-user-select:text}
.pc h3{margin:0 0 10px}
.grid10{display:grid;grid-template-columns:40px repeat(10,40px);gap:3px;font-size:13px;font-weight:800}
.grid10 div{height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#F2ECE4;color:#999}
.grid10 .h{background:none;color:#4A2E2A}
.grid10 .m{background:#7FD1B9;color:#fff}.grid10 .l{background:#FFE29A;color:#7a5a00}.grid10 .w{background:#F7B3B3;color:#8a2a2a}
.btn{padding:10px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:#F1EAE2;color:var(--ink)}
/* baker */
#baker{position:fixed;left:50%;transform:translateX(-50%);bottom:0;height:min(34vh,330px);z-index:5;filter:drop-shadow(0 8px 10px rgba(60,30,10,.3));cursor:pointer}
#bakerSay{position:fixed;left:calc(50% + min(13vh,125px));bottom:calc(min(34vh,330px) - 40px);z-index:6;background:#FFFBF5;border-radius:20px;padding:12px 18px;font-size:19px;font-weight:800;max-width:min(300px,24vw);box-shadow:0 0 0 3px #F0C3B3,0 8px 20px rgba(90,40,20,.2);display:none}
#bakerSay.on{display:block;animation:fade .3s}
@media (max-width:1000px){#baker{display:none!important}}
</style>

<section class="screen" id="home">
  <div id="scene">
    <div class="hud"><button class="chip" id="toTown"><img class="tci" src="../assets/icons/home.png" alt=""> 回小镇</button><span class="chip" id="coins"></span><span class="chip" id="taskLine" style="font-size:15px"></span><span class="grow"></span><button class="chip" id="toParent"><img class="tci" src="../assets/icons/lock.png" alt=""></button></div>
    <div id="stations"></div>
    <div id="caseBar"></div>
  </div>
</section>

  <div class="top"><button class="chip" id="quit">← 店里</button><span class="grow"></span><div class="dots" id="dots"></div><span class="grow"></span><span class="chip" id="stepName"></span></div>
  <div class="center" style="flex:1"><div class="panel center" id="stageWrap"><div class="center" id="stage" style="width:100%"></div></div></div>
</section>
<section class="screen" id="parent">
  <div class="top"><h1 style="font-size:28px">面包店 · 家长</h1><span class="grow"></span><button class="btn ghost" id="pBack">返回</button></div>
  <div id="pBody"></div>
</section>

<script>
"use strict";
const TC=window.TownCore; let T, B;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick=a=>a[Math.floor(Math.random()*a.length)];
const addDays=(d,n)=>{ const [y,m,dd]=d.split('-').map(Number); return TC.today(new Date(y,m-1,dd+n)); };
const INTERVAL={1:1,2:2,3:4,4:8,5:16}, MASTER=5, FAST_MS=6000, ORDERS=6;
// table unlock order and the treat each table unlocks
const TABLE_ORDER=[2,5,10,3,4,6,7,8,9];
const tt=i=>`<i class="tt" style="background-position:${(i%4)*100/3}% ${Math.floor(i/4)*50}%"></i>`;
const TREATS={2:[tt(0),'甜甜圈'],5:[tt(1),'杯子蛋糕'],10:[tt(2),'牛角包'],3:[tt(3),'曲奇'],4:[tt(4),'水果派'],6:[tt(5),'奶油蛋糕'],7:[tt(6),'华夫饼'],8:[tt(7),'椒盐卷'],9:[tt(8),'生日蛋糕']};
const NUM=['零','一','两','三','四','五','六','七','八','九','十'];

/* ---------- facts & mastery ---------- */
// a fact is "a×b" meaning a rows of b (b is the table being practised)
function fk(a,b){ return a+'x'+b; }
function fst(k){ return B.facts[k]||(B.facts[k]={box:0,seen:0,ok:0,wrong:0,ms:[],due:null}); }
function mastered(k){ return (B.facts[k]?.box||0)>=MASTER-1; }
function tableFacts(t){ return Array.from({length:10},(_,i)=>fk(i+1,t)); }
function tableMastery(t){ const f=tableFacts(t); return f.filter(mastered).length/f.length; }
function unlockedTables(){ return B.tables; }
function maybeUnlock(){ const msgs=[]; const cur=B.tables; const all=cur.filter(t=>tableMastery(t)<0.8).length<=1;
  cur.forEach(t=>{ if(tableMastery(t)>=0.8 && !B.treats.includes(t)){ B.treats.push(t); B.newTreat=t; msgs.push(`学会了 ${t} 的乘法表，点心柜里多了「${TREATS[t][1]}」！`); } });
  if(all){ const next=TABLE_ORDER.find(t=>!cur.includes(t)); if(next){ cur.push(next); msgs.push(`新订单来了：${next} 的乘法！`); } }
  return msgs; }
function record(k,ok,ms){ const s=fst(k), t=TC.today(); s.seen++; s.last=t; s.ms=(s.ms||[]).concat(ms).slice(-5);
  if(ok){ s.ok++; const quick=ms<FAST_MS; s.box=Math.min(s.box+(quick?1:0.5),MASTER); s.box=Math.round(s.box*2)/2; s.due=addDays(t,INTERVAL[Math.max(1,Math.floor(s.box))]||30); }
  else { s.wrong++; s.box=Math.max(0,Math.floor(s.box)-2); s.due=t; } }
const revK=k=>k.split('x').reverse().join('x');
function chooseFact(used){ const t=TC.today(); const pool=B.tables.flatMap(tableFacts).filter(k=>!used.includes(k)&&!used.includes(revK(k)));
  const due=pool.filter(k=>B.facts[k]&&B.facts[k].due&&B.facts[k].due<=t&&!mastered(k));
  const fresh=pool.filter(k=>!B.facts[k]);
  const newest=B.tables[B.tables.length-1]; const freshNew=fresh.filter(k=>k.endsWith('x'+newest));
  const r=Math.random();
  if(due.length && r<0.45) return pick(due);
  if(freshNew.length && r<0.8) return pick(freshNew);
  if(fresh.length && r<0.85) return pick(fresh);
  const weak=pool.filter(k=>!mastered(k)); if(weak.length && r<0.95) return pick(weak);
  return pick(pool); }

   ${tr.allDoneNow?`<div style="font-size:21px;font-weight:900;color:#E2683F">今天的任务全部完成！奖励 ${TC.fmt(tr.bonus)} + 1 个印章</div>`:''}
   <div style="display:flex;gap:14px"><button class="big pink" id="again">再来 6 单</button><button class="big white" id="toShop">回店里</button></div>`;
  burst(innerWidth/2,innerHeight/3,['coin','cupcake','cupcake','sparkle'],18); say(`打烊啦！今天一次做对${good}单`+(msgs.length?'，还解锁了新东西！':''));
  $('#again').onclick=()=>TC.afterReward(()=>openShop(kind)); $('#toShop').onclick=()=>TC.afterReward(()=>go('home')); }


async function otherShift(kind){ const S= kind==='time'?B.time:B.frac, max=kind==='time'?5:5, LV=kind==='time'?TIME_LV:FR_LV; const log={d:TC.today(),ts:Date.now(),kind,items:[]}; let up=false;
  SEEN=new Set(); let streak=0, chalUsed=false;
  for(let i=0;i<ORDERS;i++){ const chal= streak>=3 && !chalUsed && S.lv<max && i<ORDERS-1; if(chal) chalUsed=true; setDots(ORDERS,i,chal); const c=customer();
    if(chal){ say(L('哇，挑战单来啦！难一点点哦','Wow, a challenge order! A little harder.')); await sleep(1600); }
    const r= kind==='time'? await ovenOrder(c,chal?S.lv+1:0) : await cakeOrder(c,chal?S.lv+1:0);
    log.items.push({k:r.k,ok:r.ok,ms:r.ms,lv:chal?S.lv+1:S.lv,chal}); streak=r.ok?streak+1:0;
    if(chal){ if(r.ok){ S.lv++; S.streak=0; up=true; } } else if(levelStep(S,r.ok,max)) up=true; TC.save(); }
  B.sessions.push(log); const good=log.items.filter(x=>x.ok).length; const cents=120+good*30; TC.earn(cents,kind==='time'?'面包店烤箱计时':'面包店切蛋糕'); const tr=TC.taskDone('math'); await TC.saveNow();
  $('#stepName').textContent='打烊啦'; $('#dots').innerHTML='';
  $('#stage').innerHTML=`<img src="../assets/outfits/${T.outfit}.webp" style="height:220px" onerror="this.remove()"><h1>6 单都做完啦！</h1>
   <div style="font-size:22px">一次就做对 <b style="color:var(--pink-d)">${good}</b> 单</div><div class="chip" style="font-size:24px">${TC.icon('coin')} +${TC.fmt(cents)}</div>
   ${up?`<div style="font-size:21px;font-weight:900;color:#2E8B74">升级啦！下一关：${LV[S.lv].name}</div>`:''}
   ${tr.allDoneNow?`<div style="font-size:21px;font-weight:900;color:#E2683F">今天的任务全部完成！奖励 ${TC.fmt(tr.bonus)} + 1 个印章</div>`:''}
   <div style="display:flex;gap:14px"><button class="big pink" id="again">再来 6 单</button><button class="big white" id="toShop">回店里</button></div>`;
  burst(innerWidth/2,innerHeight/3,['coin','cupcake','cupcake','sparkle'],18); say(`打烊啦！今天一次做对${good}单`+(up?'，还升级了！':''));
  $('#again').onclick=()=>TC.afterReward(()=>openShop(kind)); $('#toShop').onclick=()=>TC.afterReward(()=>go('home')); }
/* ---------- home ---------- */
let go=function(id){ $$('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); if(id==='home') renderHome(); if($('#baker')) $('#baker').style.display=id==='home'?'':'none'; $('#bakerSay').classList.remove('on'); };
// station boxes in % of the bakery picture (x0,y0,x1,y1); label = position of the blank plaque
let STATIONS=[
 {id:'time', zh:'烤箱', box:[1,33,23.5,80], lab:[13.1,28], tag:'烤箱计时（看时间）', go:()=>openShop('time')},
 {id:'mul',  zh:'烤盘台', box:[24.6,33,56.4,80], lab:[39.8,28], tag:'烤盘订单（乘法）', go:()=>openShop('mul')},
 {id:'div',  zh:'打包台', box:[57,33,80,80], lab:[67.3,28], tag:'装盒订单（除法）', go:()=>openShop('div')},
 {id:'frac', zh:'蛋糕柜', box:[80.6,33,100,80], lab:[92,27.5], tag:'切蛋糕（分数）', go:()=>openShop('frac')},
];
try{ if(window.BAKERY_LAYOUT) STATIONS=STATIONS.map(s=>Object.assign(s,window.BAKERY_LAYOUT[s.id]||{})); }catch(e){}
function renderHome(){ $('#coins').innerHTML=TC.icon('coin')+' '+TC.fmt(T.coins);
  $('#stations').innerHTML=STATIONS.map(s=>{ const [x0,y0,x1,y1]=s.box; return `<div class="st ${s.soon?'soon':''}" data-id="${s.id}" style="left:${x0}%;top:${y0}%;width:${x1-x0}%;height:${y1-y0}%"><div class="tag">${s.tag}</div></div><div class="st lab0" style="left:${s.lab[0]}%;top:${s.lab[1]}%;pointer-events:none"><span class="lab" style="top:0">${s.zh}</span></div>`; }).join('');
  $$('.st[data-id]').forEach(el=>el.onclick=()=>{ const s=STATIONS.find(x=>x.id===el.dataset.id); if(s.soon) return bubbleAt(el,s.soon); s.go(); });
  $('#caseBar').innerHTML='<div class="cl">点心柜</div>'+TABLE_ORDER.map(t=>{ const own=B.treats.includes(t); return `<div class="${own?'':'lock'}" title="${t} 的乘法表 ${Math.round(tableMastery(t)*100)}%">${TREATS[t][0]}<small>×${t}</small></div>`; }).join('');
  const tk=TC.tasksToday().find(t=>t.game==='math'); $('#taskLine').textContent= tk? (tk.done>=tk.need?'今天的面包店任务完成啦！':`今日任务：做 ${tk.need} 轮订单（已完成 ${tk.done}）`):''; $('#taskLine').style.display=tk?'':'none'; }
function bubbleAt(el,text){ $$('.bubble').forEach(b=>b.remove()); const r=el.getBoundingClientRect(), sr=$('#scene').getBoundingClientRect(); const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  b.style.left=((r.left+r.width/2-sr.left)/sr.width*100)+'%'; b.style.top=((r.top+r.height*.35-sr.top)/sr.height*100)+'%'; $('#scene').appendChild(b); say(text); setTimeout(()=>b.remove(),3500); }
$('#toTown').onclick=()=>{ location.href='../小镇.html'; };
$('#quit').onclick=()=>{ speechSynthesis.cancel(); go('home'); };
$('#pBack').onclick=()=>go('home');
$('#toParent').onclick=async()=>{ if(await TC.askPin()) openParent(); };
if($('#baker')) $('#baker').onclick=()=>baker(pick(['数不过来的时候，一排一排地数！','2、4、6、8……跳着数更快哦','你是我最得力的小帮手！','分东西要"平均"，每份一样多～']),true);

/* ---------- parent ---------- */
function openParent(){ go('parent'); const last=B.sessions.slice(-10); const items=last.flatMap(s=>s.items);
  const acc=items.length?Math.round(items.filter(x=>x.ok).length/items.length*100):0; const avg=items.length?Math.round(items.reduce((a,x)=>a+x.ms,0)/items.length/100)/10:0;
  const quick=items.filter(x=>x.mode==='quick'), qacc=quick.length?Math.round(quick.filter(x=>x.ok).length/quick.length*100):null;
  let verdict='还在热身，多玩几次再看'; if(items.length>=18){ if(acc>=90&&avg<6) verdict='偏简单：系统会自动加新的乘法表；也可以在下面手动开放'; else if(acc<70) verdict='偏难：会自动多复习错题，暂不加新表'; else verdict='难度刚好'; }
  $('#pBody').innerHTML=`<div class="pc"><h3>最近 ${last.length} 次营业：一次答对率 ${acc}% · 平均用时 ${avg} 秒${qacc!==null?` · 快速订单正确率 ${qacc}%`:''}</h3><div style="font-size:16px">${verdict}</div>
    <div class="muted" style="font-size:14px;margin-top:6px">规则：同一张表 80% 的算式"掌握"（连续几次一次答对且 6 秒内）就解锁下一张。顺序：${TABLE_ORDER.join(' → ')}。新算式先"放烤盘"看着数，熟了变"看烤盘"，再熟就是只有算式的快速订单。除法用她做过的乘法反过来出。</div></div>
   <div class="pc"><h3>乘法表掌握情况（行 = 几排，列 = 每排几个）</h3><div class="grid10"><div class="h"></div>${Array.from({length:10},(_,i)=>`<div class="h">×${i+1}</div>`).join('')}
    ${Array.from({length:10},(_,r)=>`<div class="h">${r+1}</div>`+Array.from({length:10},(_,c)=>{ const s=B.facts[fk(r+1,c+1)]; const cls=!s?'':(s.box>=MASTER-1?'m':(s.wrong>s.ok?'w':'l')); return `<div class="${cls}">${s?(r+1)*(c+1):''}</div>`; }).join('')).join('')}</div>
    <div class="muted" style="font-size:13px;margin-top:6px">绿 = 掌握 · 黄 = 学习中 · 红 = 常错 · 灰 = 还没出过</div></div>
   <div class="pc"><h3>开放的乘法表</h3>${TABLE_ORDER.map(t=>`<label style="margin-right:12px;font-size:17px"><input type="checkbox" data-t="${t}" ${B.tables.includes(t)?'checked':''}> ×${t}</label>`).join('')}
    <div class="muted" style="font-size:13px;margin-top:6px">一般不用动，系统会自动开放。如果觉得太简单，可以直接勾上更难的表。</div></div>`;
  $('#pBody').insertAdjacentHTML('beforeend',`<div class="pc"><h3>看时间 & 分数</h3>
    <div style="font-size:16px;line-height:1.9">看时间：第 ${B.time.lv} 关「${TIME_LV[B.time.lv].name}」 · 连续一次答对 ${B.time.streak||0}/5 · 共做 ${B.time.done||0} 单，一次答对 ${B.time.okN||0}<br>
    分数：第 ${B.frac.lv} 关「${FR_LV[B.frac.lv].name}」 · 连续一次答对 ${B.frac.streak||0}/5 · 共做 ${B.frac.done||0} 单，一次答对 ${B.frac.okN||0}</div>
    <div class="muted" style="font-size:13px;margin:6px 0">规则：连续 5 单一次做对就升一关。看时间：整点 → 半点 → 一刻钟 → 五分钟 → 烤多久（经过时间）。分数：一半/平均分 → 四分之一 → 三分之一 → 几分之几 → 比大小。</div>
    看时间关卡 <select id="tlv">${TIME_LV.slice(1).map((x,i)=>`<option value="${i+1}" ${B.time.lv===i+1?'selected':''}>${i+1} ${x.name}</option>`).join('')}</select>　
    分数关卡 <select id="flv">${FR_LV.slice(1).map((x,i)=>`<option value="${i+1}" ${B.frac.lv===i+1?'selected':''}>${i+1} ${x.name}</option>`).join('')}</select></div>`);
  $('#tlv').onchange=e=>{ B.time.lv=+e.target.value; B.time.streak=0; TC.save(); }; $('#flv').onchange=e=>{ B.frac.lv=+e.target.value; B.frac.streak=0; TC.save(); };
  $$('[data-t]').forEach(x=>x.onchange=()=>{ const t=+x.dataset.t; if(x.checked){ if(!B.tables.includes(t)) B.tables.push(t); } else { B.tables=B.tables.filter(v=>v!==t); if(!B.tables.length) B.tables=[2]; } TC.save(); }); }

/* ---------- boot ---------- */
(async()=>{ T=await TC.ready; T.bake=T.bake||{facts:{},tables:[2,5,10],treats:[],sessions:[]}; B=T.bake;
  ['facts'].forEach(k=>B[k]=B[k]||{}); B.time=B.time||{lv:1,streak:0}; B.frac=B.frac||{lv:1,streak:0}; ['tables','treats','sessions'].forEach(k=>B[k]=B[k]||[]); if(!B.tables.length) B.tables=[2,5,10];
  if(!B.seeded){ [2,5,10].forEach(t=>tableFacts(t).forEach(k=>{ if(!B.facts[k]) B.facts[k]={box:3,seen:0,ok:0,wrong:0,ms:[],due:null}; })); B.seeded=true; }
  TC.startTimer(); go('home');
  if(location.hash==='#parent'){ history.replaceState(null,'',location.pathname); if(await TC.parentPass()){ openParent(); return; } }
  if(TC.guard()) return;
  await TC.guide(TC.GUIDES.math);
  setTimeout(()=>{ const m=B.sessions.length?'欢迎回来，小店长！今天也有好多客人哦':'欢迎来到面包店！我是猫店长，今天你来帮我卖点心吧！'; baker(m); say(m); },700); })();
</script>
