<!DOCTYPE html>
<html lang="zh-CN" data-town-root=".">
<head><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2"><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="动物小镇"><meta name="theme-color" content="#fff6ea">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Little Town · 动物小镇</title>
<link rel="icon" href="assets/icon.png">

<meta name="apple-mobile-web-app-title" content="My Little Town">
<style>
:root{--ink:#3B3049;--soft:#8A7F99;--cream:#FFF8EE;--coral:#FF8A6B;--teal:#3FBFAD;--teal-d:#2EA493;--sun:#FFC94D;--line:#F0E4D6;
  --font:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:#BFE3A6;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
/* ---------- map ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#CFEAB5,#A9D58F)}
#map{position:relative;width:min(100vw,calc(100vh*1672/941));aspect-ratio:1672/941;background:url(assets/map_day.jpg) center/100% 100% no-repeat;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.hs{position:absolute;cursor:pointer;border-radius:22px;transition:background .2s,box-shadow .2s}
.hs:hover{background:rgba(255,255,255,.14);box-shadow:0 0 0 4px rgba(255,255,255,.55),0 0 30px rgba(255,240,180,.6)}
.hs.soon{cursor:help}
.bldg{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(80,50,20,.18))}
.plaque{position:absolute;transform:translate(-50%,-50%);font-weight:900;color:#5A3A1E;font-size:calc(min(100vw,100vh*1.777)*0.0128);letter-spacing:.06em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.6)}

.pet{position:absolute;width:4.2%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.2);overflow:hidden;animation:bob 3.2s ease-in-out infinite;pointer-events:none}
.pet i{position:absolute;inset:0;background-repeat:no-repeat}
@keyframes bob{50%{transform:translateY(-12%) rotate(-4deg)}}
#rubyWalker{position:absolute;left:41.7%;top:53%;height:21%;aspect-ratio:557/900;transform:translate(-50%,-100%);z-index:3;cursor:pointer;transition-property:left,top;transition-timing-function:linear}
#rubyWalker .sh{position:absolute;left:22%;right:22%;bottom:-2%;height:5%;border-radius:50%;background:rgba(60,40,20,.25);filter:blur(2px)}
#rubyOnMap{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));transform-origin:50% 60%}
#rubyWalker.walk #rubyOnMap{animation:rwalk .42s ease-in-out infinite}
@keyframes rwalk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4%) rotate(2deg)}}
#rubyOnMap.cartwheel{animation:rcart 1.1s ease-in-out}
@keyframes rcart{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(var(--cw,90%)) rotate(var(--cr,360deg))}}
#rubyOnMap.jump{animation:rjump .7s cubic-bezier(.3,.7,.4,1) 2}
@keyframes rjump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-22%) scale(.97,1.04)}}
#rubyOnMap.spin{animation:rspin .9s ease-in-out}
@keyframes rspin{to{transform:rotateY(360deg)}}
#rubyOnMap.wave{animation:rwave .5s ease-in-out 3}
@keyframes rwave{50%{transform:rotate(-6deg) translateY(-3%)}}
#rubyOnMap.splitpose{width:160%;left:-30%;transform-origin:50% 100%;animation:rsplit .5s ease-out}
@keyframes rsplit{from{transform:scale(1,.6);opacity:.4}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;padding:10px 16px;border-radius:18px;font-weight:800;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap;z-index:20;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:10px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.5);opacity:0}}
/* ---------- HUD ---------- */
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:30;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:999px;padding:9px 18px;font-weight:900;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
#dayBar{width:190px;height:18px;border-radius:999px;background:#2B2D5C;position:relative;overflow:hidden}
#dayBar b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FFD66B,#FFB36B);border-radius:999px;transition:width 1s}
.grow{flex:1}
.mood{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em;background:url(assets/moods.webp) 0 0/500% 200% no-repeat}
.gr{display:inline-block;width:1.6em;height:1.6em;vertical-align:-.45em;background:url(assets/groceries.webp) 0 0/400% 300% no-repeat}
.iconbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.94);font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* ---------- panels ---------- */
.panel{position:fixed;inset:0;z-index:50;background:rgba(59,48,73,.42);display:none;align-items:center;justify-content:center;padding:2.5vh 2.5vw}
.panel.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--cream);border-radius:30px;width:min(1180px,100%);height:min(820px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet header{display:flex;align-items:center;gap:14px;padding:16px 22px;background:#fff;border-bottom:3px solid var(--line)}
.sheet header h2{margin:0;font-size:30px;font-weight:900}
.sheet .body{flex:1;overflow:auto;padding:20px 22px}
.close{width:52px;height:52px;border-radius:50%;background:var(--cream);font-size:24px}
.tabs{display:flex;gap:10px}
.tabs button{padding:10px 20px;border-radius:999px;background:var(--cream);font-weight:800;font-size:18px}
.tabs button.on{background:var(--ink);color:#fff}
.big{font-size:22px;font-weight:900;border-radius:999px;padding:14px 30px;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.teal{background:var(--teal);color:#fff}.coral{background:var(--coral);color:#fff}.white{background:#fff}.sunb{background:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#fff;border-radius:22px;padding:12px;text-align:center;box-shadow:0 5px 0 var(--line);cursor:pointer;position:relative;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card img{height:190px;max-width:100%;object-fit:contain}
.card .nm{font-weight:900;font-size:18px;margin-top:6px}
.card .pr{font-weight:900;color:#C77700;font-size:18px}
.card.owned .pr{color:var(--teal-d)}
.card.wearing{outline:4px solid var(--teal)}
.card .emo{font-size:84px;line-height:190px;height:190px}
.muted{color:var(--soft)}
/* money */
.money-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.coin{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 4px 0 rgba(0,0,0,.12);cursor:pointer;color:#4a3a10}
.coin.c10{background:radial-gradient(circle at 35% 35%,#E9B38A,#B86F3E);color:#4A2410;width:62px;height:62px;font-size:17px}
.coin.c20{background:radial-gradient(circle at 35% 35%,#F2F2F2,#B9B9B9);width:70px;height:70px}
.coin.c50{background:radial-gradient(circle at 35% 35%,#F5F5F5,#A9A9A9);width:82px;height:82px}
.coin.c100{background:radial-gradient(circle at 35% 35%,#FFE89A,#D7A92A);width:72px;height:72px}
.coin.c200{background:radial-gradient(circle at 35% 35%,#FFE38A,#C99A1C);width:66px;height:66px}
.note{width:118px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);cursor:pointer;border:3px solid rgba(255,255,255,.5)}
.note.c500{background:linear-gradient(135deg,#F2A15A,#C9682A)}.note.c1000{background:linear-gradient(135deg,#5AA7E6,#2E6FB5)}.note.c2000{background:linear-gradient(135deg,#6CC36F,#2F8C45)}.note.c5000{background:linear-gradient(135deg,#B184DE,#7448AA)}
.tray{min-height:110px;background:#fff;border-radius:22px;border:4px dashed #E7D6C4;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px;margin:14px 0}
.tray:empty::before{content:var(--emp,'点下面的钱放到这里');color:#C9B9A6;font-weight:800;font-size:18px}
.pricebig{font-size:54px;font-weight:900;color:#C77700}
.opt{font-size:30px;font-weight:900;padding:18px 34px;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line)}
.opt.right{background:#D8F3EE}.opt.wrong{background:#FFE0D6}
.customer{display:flex;align-items:center;gap:18px;justify-content:center}
.customer .av{width:130px;height:130px;border-radius:50%;background:#fff;overflow:hidden;position:relative;box-shadow:0 5px 0 var(--line)}
.customer .av i{position:absolute;inset:0;background-repeat:no-repeat}
.say{background:#fff;border-radius:22px;padding:16px 22px;font-size:22px;font-weight:800;box-shadow:0 5px 0 var(--line);max-width:560px;line-height:1.5}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:16px;height:16px;border-radius:50%;background:#E7D6C4}.dots i.ok{background:var(--teal)}.dots i.cur{background:var(--coral)}
/* home */
.homewrap{display:flex;gap:24px;height:100%}
.homewrap .me{flex:0 0 36%;background:linear-gradient(#FFE9EF,#FFF8EE);border-radius:26px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.homewrap .me img{max-height:96%;max-width:96%}
.homewrap .wardrobe{flex:1;overflow:auto}
/* park */
.stamps{display:flex;gap:14px;align-items:center}
.stamps i{width:64px;height:64px;border-radius:50%;border:4px dashed #E7D6C4;display:flex;align-items:center;justify-content:center;font-size:34px;font-style:normal;background:#fff}
.stamps i.on{border:4px solid var(--coral);background:#FFF0EA}
.egg{font-size:110px;cursor:pointer;animation:wob 1s ease-in-out infinite;display:inline-block}
@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.ani{position:relative;overflow:hidden;border-radius:18px;background:#fff}
.ani i{position:absolute;inset:0;background-repeat:no-repeat}
.parkfield{position:relative;height:240px;border-radius:22px;background:linear-gradient(#DDF2CB,#BFE3A6);margin-bottom:16px;overflow:hidden}
.parkfield span{position:absolute;font-size:44px}
.pti{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.15em;background:url(assets/petitems.webp) 0 0/400% 300% no-repeat}
.park{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#BFE3A6 url(assets/park_bg.jpg) center/cover;margin-bottom:16px;box-shadow:0 4px 0 #CFE7BF;container-type:inline-size}
.park .dc{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:0;filter:drop-shadow(0 4px 3px rgba(60,90,40,.25))}
.park .dc .pti{width:100%;height:auto;aspect-ratio:1}
.park .dc.fly{animation:kite 4s ease-in-out infinite;filter:none}
@keyframes kite{0%,100%{transform:translate(-50%,-100%) rotate(-6deg)}50%{transform:translate(-46%,-108%) rotate(6deg)}}
.park .pk{position:absolute;transform:translate(-50%,-100%);transition:left 2.6s ease-in-out,top 2.6s ease-in-out;cursor:pointer}
.park .pk>div{width:100%;aspect-ratio:1;position:relative;animation:bob 1.6s ease-in-out infinite}
.park .pk i{position:absolute;inset:0;background-repeat:no-repeat}
.park .pk.flip>div i{transform:scaleX(-1)}
.park .pk.hop>div{animation:hop .5s}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-35%)}}
.park .say{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:14px;padding:4px 10px;font-weight:900;font-size:min(2.2cqw,18px);box-shadow:0 3px 8px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;animation:popin .4s}
.park .empty{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:rgba(255,255,255,.85);border-radius:16px;padding:10px 18px;font-weight:800;font-size:18px;text-align:center}
/* tasks */
.task{display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:16px 20px;box-shadow:0 5px 0 var(--line);margin-bottom:14px;font-size:22px;font-weight:800}
.task .ic{font-size:40px}.task .ck{font-size:34px}
/* parent */
.pc{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 0 var(--line);user-select:text;-webkit-user-select:text}
.pc h3{margin:0 0 10px;font-size:19px}
.pc label{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:17px}
.pc input[type=radio],.pc input[type=checkbox]{width:20px;height:20px}
.pc input[type=number],.pc input[type=time],.pc select{font-size:17px;padding:8px 10px;border-radius:10px;border:2px solid #EDE3D8;font-family:inherit}
.btn{padding:10px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:#F1EAE2;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px;border-bottom:1px solid #F1EAE2;text-align:left}
.burst{position:fixed;pointer-events:none;font-size:30px;z-index:200;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.reveal .ani{width:240px;height:240px;margin:0 auto;animation:popin .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(0) rotate(-30deg)}}

#mailBtn{position:relative}#mailDot{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#E9573F;display:none;box-shadow:0 0 0 2px #fff}
#mailBtn.has #mailDot{display:block}#mailBtn.has{animation:mailWig 1.6s ease-in-out infinite}
@keyframes mailWig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.letter{background:#FFFDF7;border-radius:18px;padding:16px 20px;margin-bottom:14px;box-shadow:0 0 0 2px #F1E4CF,0 4px 0 #EADBC2;position:relative}
.letter.mum{background:linear-gradient(#FFF6F8,#FFEFF3);box-shadow:0 0 0 2px #F7C6D3,0 4px 0 #EDB0C1;margin-left:40px}
.letter.me{margin-right:40px}
.letter .from{font-size:14px;font-weight:900;color:#9A8577;margin-bottom:6px}
.letter .txt{font-size:20px;line-height:1.6;white-space:pre-wrap}
.letter.new::after{content:'NEW';position:absolute;right:-6px;top:-8px;background:#E9573F;color:#fff;font-size:11px;font-weight:900;border-radius:8px;padding:2px 6px}
#mailPop{position:fixed;inset:0;z-index:60;background:rgba(40,30,60,.45);display:none;align-items:center;justify-content:center}
#mailPop.on{display:flex}
#mailPop .env{background:#FFF8EC;border-radius:26px;padding:28px 34px;max-width:620px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{transform:scale(.4) rotate(-8deg);opacity:0}}
#mailPop .big1{font-size:90px;line-height:1}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1E7D6F;color:#fff;font-weight:900;border-radius:999px;padding:10px 22px;z-index:99999;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:popIn .3s}
.rep td,.rep th{padding:6px 10px;text-align:left;border-bottom:1px solid #F1EAE2;font-size:15px}
.rep th{color:#9A8577}
.rep{width:100%;border-collapse:collapse}.rep th{position:sticky;top:0;background:#fff}
.pc h4{margin:16px 0 6px;font-size:16px;color:#7A6455}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.dash div{background:#FFF7EE;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dash b{font-size:22px;color:#E2683F}.dash span{font-size:13px;color:#8C7766}.dash i{font-style:normal;font-size:11px}
.adj{display:inline-flex;gap:6px}.adj button{width:38px;height:34px;border-radius:10px;border:2px solid #EADBD3;background:#fff;font:900 20px var(--font,system-ui);cursor:pointer;color:#5A4636}
.adj button:hover{background:#FFF0EA}.adj button:disabled{opacity:.3;cursor:default}
.dl{border-bottom:1px solid #F1EAE2;padding:10px 0}.dl .tx{font:18px/1.6 'Chalkboard SE','Comic Sans MS',sans-serif;white-space:pre-wrap;margin:4px 0}
.dl.mum{margin-top:8px;}
#lf{position:fixed;inset:0;z-index:5000;background:rgba(40,25,45,0);display:flex;align-items:center;justify-content:center;transition:background .4s,opacity .35s;font-family:inherit}
#lf.in{background:rgba(40,25,45,.6)}#lf.bye{opacity:0}
#lf .lfwrap{position:relative;width:min(560px,92vw);height:min(640px,88vh);display:flex;align-items:center;justify-content:center}
#lf .envw{position:absolute;width:320px;height:210px;bottom:12%;transform:translateY(60vh);transition:transform .6s cubic-bezier(.3,1.3,.5,1),opacity .4s;perspective:800px}
#lf.in .envw{transform:none}
#lf .envsvg{position:absolute;inset:0;width:100%;height:100%;z-index:3}
#lf .flap{position:absolute;left:4px;right:4px;top:4px;height:118px;background:#F2B6C6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .6s;z-index:4}
#lf .seal{position:absolute;left:50%;top:96px;transform:translate(-50%,-50%);z-index:5;font-size:34px;transition:opacity .3s}
#lf.open .flap{transform:rotateX(180deg);z-index:1}#lf.open .seal{opacity:0}
#lf .mini{position:absolute;left:24px;right:24px;top:20px;height:170px;background:#FFFDF6 repeating-linear-gradient(#FFFDF6 0 22px,#F1E6DA 22px 23px);border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2;transition:transform .6s}
#lf.rise .mini{transform:translateY(-150px)}
#lf.read .envw{opacity:0;transform:translateY(40px)}
#lf .paper{position:absolute;inset:0;margin:auto;width:100%;height:100%;background:#FFFDF6 repeating-linear-gradient(transparent 0 35px,#EFE3D6 35px 36px);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:26px 30px;display:flex;flex-direction:column;opacity:0;transform:scale(.4) translateY(180px);transition:transform .55s cubic-bezier(.3,1.2,.5,1),opacity .4s;pointer-events:none}
#lf.read .paper#pp{opacity:1;transform:none;pointer-events:auto}
#lf.write .paper#pp{opacity:0;transform:translateX(-30px) rotate(-3deg);pointer-events:none}
#lf.write .paper#pw{opacity:1;transform:none;pointer-events:auto}
#lf .paper.mum{background-color:#FFF6F8}
#lf .ph{display:flex;justify-content:space-between;color:#9A8577;font-weight:800;margin-bottom:10px}
#lf .pt{flex:1;overflow:auto;font:22px/36px 'Chalkboard SE','Comic Sans MS',sans-serif;white-space:pre-wrap;color:#3E2F48}
#lf .pf{text-align:right;font:20px 'Chalkboard SE','Comic Sans MS',sans-serif;color:#7A5A8A;margin:6px 0}
#lf textarea{flex:1;border:none;background:transparent;resize:none;font:22px/36px 'Chalkboard SE','Comic Sans MS',sans-serif;color:#7A3550;outline:none}
#lf .pbtn{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
#lf.fold .paper#pw{transform:scale(.5,.12) translateY(500px);opacity:.9;transition:transform .7s ease-in,opacity .7s}
#lf.fold .envw{opacity:1;transform:none;transition:opacity .3s}#lf.fold .flap{transform:rotateX(180deg);z-index:1}#lf.fold .mini{transform:none}
#lf.fold .pbtn,#lf.fold .ph{opacity:0}#lf.seal2 .paper#pw{opacity:0}#lf.seal2 .flap{transform:none;z-index:4}#lf.seal2 .seal{opacity:1}
#lf.fly .envw{transform:translate(70vw,-80vh) rotate(25deg) scale(.4);transition:transform .9s cubic-bezier(.5,0,.8,.4)}
#lf .lfmsg{position:absolute;display:none;background:#fff;border-radius:20px;padding:22px 30px;font-size:20px;font-weight:800;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);line-height:1.6}
#lf.done .lfmsg{display:block;animation:popin .4s}
.dl.mum{padding-left:26px;border-left:4px solid #FFC7D6;margin-left:6px}

/* ---------- opening: clouds part to reveal the town ---------- */
#intro{position:fixed;inset:0;z-index:80;pointer-events:auto;overflow:hidden;background:linear-gradient(#8FCBEF,#D7EEFA)}
#intro .cl{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 55%,#EEF6FB 100%);filter:blur(1.5px);box-shadow:0 10px 30px rgba(120,160,200,.25)}
#intro .title{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#5A4636;opacity:0;animation:tIn 1s .3s ease forwards;z-index:2;font-family:var(--font)}
#intro .title b{display:block;font-size:min(9vw,92px);font-weight:900;letter-spacing:2px;color:#E2683F;text-shadow:0 4px 0 #fff,0 8px 20px rgba(0,0,0,.12)}
#intro .title span{font-size:min(4vw,34px);font-weight:800;letter-spacing:10px}
#intro.open{background:transparent;transition:background 1.4s ease}
#intro.open .cl.l{transform:translateX(-80vw) scale(1.3)!important;opacity:0;transition:transform 2.2s cubic-bezier(.5,0,.3,1),opacity 2.2s}
#intro.open .cl.r{transform:translateX(80vw) scale(1.3)!important;opacity:0;transition:transform 2.2s cubic-bezier(.5,0,.3,1),opacity 2.2s}
#intro.open .title{animation:tOut .9s ease forwards}
@keyframes tIn{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes tOut{to{opacity:0;transform:translate(-50%,-70%) scale(1.1)}}
#map.zoomin{animation:mapIn 2.6s cubic-bezier(.3,.6,.3,1)}
@keyframes mapIn{from{transform:scale(1.12);filter:saturate(.7) brightness(1.1)}}
/* ---------- first-time setup ---------- */
#setup{position:fixed;inset:0;z-index:70;background:rgba(60,40,30,.35);display:none;align-items:center;justify-content:center}
#setup.on{display:flex}
#setup .card{background:#FFFBF2;border-radius:30px;padding:30px 40px;width:min(680px,92vw);text-align:center;box-shadow:0 0 0 4px #F3D9A8,0 20px 60px rgba(0,0,0,.25);animation:popIn .5s cubic-bezier(.3,1.5,.5,1)}
#setup h2{font-size:34px;margin:6px 0 4px}
#setup .sub{font-size:18px;color:#8C7766;font-weight:700;margin-bottom:18px}
#setup .opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#setup .opt{background:#fff;border-radius:22px;padding:18px 24px;font-size:24px;font-weight:900;box-shadow:0 0 0 3px #F1E4CF,0 5px 0 #E3D0B2;min-width:120px;cursor:pointer}
#setup .opt:hover{transform:translateY(-3px)}#setup .opt.sel{box-shadow:0 0 0 4px #2EA493,0 5px 0 #1F7A6D}
#setup .opt small{display:block;font-size:14px;color:#8C7766;margin-top:4px}
#setup input{font-size:28px;font-weight:800;text-align:center;border-radius:18px;border:3px solid #F1E4CF;padding:12px 16px;width:70%;font-family:inherit}
#setup .dots{display:flex;gap:8px;justify-content:center;margin-top:20px}#setup .dots i{width:12px;height:12px;border-radius:50%;background:#EADFCB}#setup .dots i.on{background:#E2683F}
#langBtn{font-size:15px;font-weight:900;width:auto;padding:0 14px;border-radius:999px}

/* ---------- shop scene ---------- */
#shopScene{position:fixed;inset:0;z-index:30;background:#EED9CF;display:none;align-items:center;justify-content:center}
#shopScene.on{display:flex;animation:fadein .3s}
#shopScene .sc{position:relative;width:min(100vw,calc(100vh*1672/941));aspect-ratio:1672/941;background:url(assets/shop_bg.jpg) center/100% 100% no-repeat;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden}
#shopScene .hud2{position:absolute;left:1.2%;right:1.2%;top:2%;display:flex;gap:10px;align-items:center;z-index:3}
.sst{position:absolute;cursor:pointer;border-radius:22px;transition:background .2s,box-shadow .2s}
.sst:hover{background:rgba(255,255,255,.2);box-shadow:0 0 0 5px rgba(255,255,255,.7)}
.sst .tag{position:absolute;left:50%;bottom:-4%;transform:translateX(-50%);background:#FFFBF5;border-radius:999px;padding:calc(min(100vw,100vh*1.777)*.008) calc(min(100vw,100vh*1.777)*.016);font-weight:900;font-size:calc(min(100vw,100vh*1.777)*.0145);white-space:nowrap;box-shadow:0 0 0 3px #F0C3B3,0 5px 0 #E3B0A0;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.slab{position:absolute;transform:translate(-50%,-50%);font-weight:900;color:#5A3A1E;white-space:nowrap;font-size:calc(min(100vw,100vh*1.777)*.02);letter-spacing:.08em;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.6)}
html[lang=en] .slab{font-size:calc(min(100vw,100vh*1.777)*.0155);letter-spacing:.02em;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#tillChoice{position:absolute;right:3%;bottom:20%;display:none;flex-direction:column;gap:12px;z-index:4}
#tillChoice.on{display:flex}
#tillChoice button{font-size:calc(min(100vw,100vh*1.777)*.016);padding:14px 26px}
/* accessories + nails */
.acc{width:100%;aspect-ratio:1;background-repeat:no-repeat;border-radius:14px}
.nails{display:flex;gap:30px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.hand{width:min(380px,38vw);background:#fff;border-radius:22px;box-shadow:0 4px 0 #F0E0D6}
.hand .nail{cursor:pointer;transition:transform .15s}.hand .nail:hover{transform:scale(1.06)}
.hand .nail .hit{pointer-events:all}
.pal{display:grid;grid-template-columns:repeat(6,44px);gap:8px}
.pal button{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 3px 6px rgba(0,0,0,.15)}
.pal button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #E2683F}
.pats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pats button{border-radius:14px;padding:8px 12px;background:#fff;font-weight:900;font-size:16px;box-shadow:0 3px 0 #E3D0B2}
.pats button.on{background:#FFE3D8;box-shadow:0 0 0 3px #E2683F}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.album .card svg{width:100%}

/* ---------- about side panel ---------- */
#aboutPane{position:fixed;inset:0;z-index:900;pointer-events:none}
#aboutPane .bd{position:absolute;inset:0;background:rgba(40,30,50,.35);opacity:0;transition:opacity .3s}
#aboutPane .side{position:absolute;top:0;right:0;bottom:0;width:min(380px,88vw);background:#FFF8EE;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.3,1);overflow-y:auto;padding:26px 26px 30px;border-radius:24px 0 0 24px}
#aboutPane.on{pointer-events:auto}#aboutPane.on .bd{opacity:1}#aboutPane.on .side{transform:none}
#aboutPane .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:#F1EAE2;font-size:20px;font-weight:800}
.about h3{margin:0 0 4px;font-size:24px}.about .tag{color:#8A7F99;font-size:15px;line-height:1.5;margin-bottom:14px}
.about .row{background:#fff;border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.55;box-shadow:0 2px 0 #F0E4D6}
.about .row b{display:block;font-size:13px;color:#8A7F99;letter-spacing:.04em;margin-bottom:2px}
.about a{color:#2EA493;font-weight:800;word-break:break-all}
.about .foot{color:#8A7F99;font-size:13px;text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div id="stage"><div id="map"></div></div>
<div id="hud">
  <span class="chip" id="coinChip">$0.00</span>
  <button class="chip" id="taskChip">今日任务</button>
  <span class="chip" title="今天还能玩多久"><img class="tci" src="assets/icons/sun.png" alt=""> <span id="dayBar"><b></b></span> <img class="tci" src="assets/icons/moon.png" alt=""></span>
  <span class="grow"></span>
  <button class="iconbtn" id="langBtn" title="Language" data-zh>中 / EN</button>

  <button class="iconbtn" id="aboutBtn" title="About" aria-label="About"><b style="font:italic 800 26px Georgia,'Times New Roman',serif;color:#5A3A1E">i</b></button>
</div>

<section class="panel" id="pShop"><div class="sheet"><header><h2>杂货店</h2><div class="tabs" id="shopTabs"><button data-t="clothes" class="on">衣服</button><button data-t="acc">饰品</button><button data-t="nails">美甲</button><button data-t="decor">小动物用品</button><button data-t="work">当小店员赚钱</button></div><span class="grow" style="flex:1"></span><span class="chip" id="shopCoins"></span><button class="close" data-close>×</button></header><div class="body" id="shopBody"></div></div></section>
<section class="panel" id="pHome"><div class="sheet"><header><h2>我的家</h2><span style="flex:1"></span><button class="close" data-close>×</button></header><div class="body"><div class="homewrap"><div class="me" style="position:relative"><img id="meImg" alt=""></div><div class="wardrobe"><div id="diaryEntry"></div><h3 style="margin:0 0 12px;font-size:24px">我的衣柜</h3><div class="grid" id="wardrobe"></div><h3 style="margin:22px 0 12px;font-size:24px">首饰盒</h3><div class="grid" id="jewel"></div><h3 style="margin:22px 0 12px;font-size:24px">美甲相册</h3><div class="album" id="nailAlbum"></div></div></div></div></div></section>
<section class="panel" id="pPark"><div class="sheet"><header><h2>宠物乐园</h2><span style="flex:1"></span><button class="close" data-close>×</button></header><div class="body" id="parkBody"></div></div></section>
<section class="panel" id="pTasks"><div class="sheet" style="width:min(760px,100%);height:auto;max-height:100%"><header><h2>今日任务</h2><span style="flex:1"></span><button class="close" data-close>×</button></header><div class="body" id="taskBody"></div></div></section>
<section class="panel" id="pMail"><div class="sheet" style="width:min(820px,100%)"><header><h2>我的信箱</h2><span style="flex:1"></span><button class="close" data-close>×</button></header><div class="body" id="mailBody"></div></div></section>
<section class="panel" id="pParent"><div class="sheet"><header><h2>家长中心</h2><span style="flex:1"></span><button class="close" data-close>×</button></header><div class="body" id="parentBody"></div></div></section>
<section class="panel" id="pPay"><div class="sheet" style="width:min(900px,100%)"><header><h2 id="payTitle">付钱</h2><span style="flex:1"></span><button class="close" id="payClose">×</button></header><div class="body" id="payBody"></div></div></section>

<div id="shopScene" data-x><div class="sc" id="shopSc">
  <div class="hud2"><button class="chip" id="shopBack"><img class="tci" src="assets/icons/home.png" alt=""> 回小镇</button><span class="chip" id="shopSceneCoins"></span></div>
  <div id="shopStations"></div>
  <div id="tillChoice"><button class="big coral" id="tcWork">当小店员赚钱</button><button class="big white" id="tcPet">小动物用品</button></div>
</div></div>
<script src="assets/animals.js"></script>

<script src="town-core.js"></script>
<script>
"use strict";
const TC=window.TownCore; let T;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const W=1672,H=941, P=(x,y)=>`left:${x/W*100}%;top:${y/H*100}%`, R=(x0,y0,x1,y1)=>`left:${x0/W*100}%;top:${y0/H*100}%;width:${(x1-x0)/W*100}%;height:${(y1-y0)/H*100}%`;

/* ---------- catalogue ---------- */
const OUTFITS=[
 {id:'pink',zh:'粉色兔子T恤',price:0},{id:'ballet',zh:'芭蕾舞裙',price:1250},{id:'vet',zh:'小兽医',price:1480},{id:'artist',zh:'小画家',price:1320},
 {id:'summer',zh:'夏日海边',price:1150},{id:'pyjamas',zh:'猫咪睡衣',price:980},{id:'architect',zh:'小建筑师',price:1560},{id:'riding',zh:'骑马装',price:1890},
 {id:'winter',zh:'冬日暖暖',price:1640},{id:'party',zh:'派对裙',price:2150},{id:'princess',zh:'公主裙',price:2480},{id:'detective',zh:'小侦探',price:1720},{id:'catdance',zh:'学猫叫舞台服',price:1980}];
const pti=i=>`<i class="pti" style="background-position:${(i%4)*100/3}% ${Math.floor(i/4)*50}%"></i>`;
// slot = [x%, y% (bottom anchor), width%] in the park picture
const DECOR=[
 {id:'fish',zh:'小鱼干',price:220,slot:[24,70,6]},{id:'bone',zh:'大骨头',price:260,slot:[71,72,7]},{id:'ball',zh:'小皮球',price:310,slot:[49,86,4.5]},{id:'bow',zh:'蝴蝶结',price:370,slot:[37,93,5]},
 {id:'flower',zh:'花环',price:450,slot:[59,95,7]},{id:'kite',zh:'风筝',price:540,slot:[78,26,9],fly:1},{id:'teddy',zh:'小熊玩偶',price:620,slot:[30,84,7]},{id:'house',zh:'小窝',price:890,slot:[13,62,14]},
 {id:'swing',zh:'滑梯',price:1260,slot:[43,56,15]},{id:'fountain',zh:'小喷泉',price:1500,slot:[63,54,12]},{id:'cattree',zh:'猫爬架',price:1380,slot:[88,62,11]},{id:'bowl',zh:'小饭碗',price:280,slot:[79,88,6]}];
DECOR.forEach((d,i)=>d.e=pti(i));
const outfitSrc=id=>`assets/outfits/${id}.webp`;

/* ---------- map ---------- */
const SPOTS=[
 {id:'library', zh:'图书馆', box:[705,0,895,340], plaque:[808,236], go:()=>{ location.href='图书馆/拼写.html'; }},
 {id:'shop',    zh:'杂货店', box:[300,395,615,635], plaque:[485,520], rot:-4.5, go:()=>openShopScene()},
 {id:'home',    zh:'我的家', box:[650,540,1085,800], plaque:[812,665], go:()=>openHome()},
 {id:'park',    zh:'宠物乐园', box:[1000,385,1365,630], plaque:[1245,587], go:()=>openPark()},
 {id:'chinese', zh:'书院', box:[360,110,650,380], plaque:[533,264], rot:-3.5, go:()=>{ location.href='书院/认字.html'; }},
 {id:'bakery',  zh:'面包店', box:[1025,140,1210,360], plaque:[1105,256], rot:1.2, go:()=>{ location.href='面包店/烘焙.html'; }},
 {id:'board',   box:[862,350,948,440], go:()=>openTasks()},
 {id:'bridge',  box:[1395,340,1580,430], soon:'河对岸还没开放，以后可以去探险哦！'},
 {id:'castle',  box:[1470,10,1610,85], soon:'远处的城堡……等你长大一点再去看看！'},
 {id:'dock',    box:[240,690,455,820], soon:'小船还在修，以后会带你去新地方！'},
 {id:'plot1',   box:[40,275,195,365], soon:'这块空地以后会盖新房子！'},
 {id:'plot2',   box:[1165,105,1295,200], soon:'这块空地以后会盖新房子！'},
 {id:'gym',     zh:'健身房', box:[1033,699,1303,910], plaque:[1151,787], fs:0.0102, go:()=>{ location.href='健身房/编舞.html'; }},
];
const PLAQUE_EN={'图书馆':'Library','杂货店':'Shop','我的家':'My Home','宠物乐园':'Pet Park','书院':'Chinese School','面包店':'Bakery','健身房':'Gym'};
const PET_SPOTS=[[1090,455],[1310,460],[1160,520],[1350,525],[1035,540],[1265,410]];
function buildMap(){ const m=$('#map'); let h=`<img class="bldg" src="assets/gym.webp" alt="" style="${R(1033,699,1303,910)}">`;
  SPOTS.forEach(s=>{ h+=`<div class="hs ${s.soon?'soon':''}" data-id="${s.id}" style="${R(...s.box)}"></div>`; if(s.zh) h+=`<div class="plaque ${s.soon&&!s.nobadge?'soon':''}" style="${P(...s.plaque)};${s.rot?`transform:translate(-50%,-50%) rotate(${s.rot}deg);`:''}${s.fs?`font-size:calc(min(100vw,100vh*1.777)*${s.fs});letter-spacing:.06em`:(s.zh.length>3?'font-size:calc(min(100vw,100vh*1.777)*0.0098);letter-spacing:.02em':'')}${TC.lang()==='en'?(()=>{ const n=(PLAQUE_EN[s.zh]||s.zh).length; return `;font-size:calc(min(100vw,100vh*1.777)*${n>11?0.0072:n>8?0.0082:n>6?0.0092:0.0104});letter-spacing:0`; })():''}">${esc(TC.L(s.zh,PLAQUE_EN[s.zh]||s.zh))}</div>`; });
  T.animals.slice(-6).forEach((a,k)=>{ const [x,y]=PET_SPOTS[k]; h+=`<div class="pet" style="${P(x,y)};animation-delay:${k*.4}s"><i style="${TC.animalStyle(a)}"></i></div>`; });
  h+=`<div id="rubyWalker"><div class="sh"></div><img id="rubyOnMap" src="${outfitSrc(T.outfit)}" alt=""></div>`;
  m.innerHTML=h;
  $$('.hs').forEach(el=>el.onclick=e=>{ const s=SPOTS.find(x=>x.id===el.dataset.id); if(s.soon) bubble(el,s.soon); else s.go(); });
  $('#rubyWalker').onclick=()=>openHome(); startWalker();
}

/* ---------- child walks around the plaza ---------- */
const WALK_PTS=[[743,517],[679,482],[883,522],[976,482],[985,425],[690,425],[812,528],[945,440]];
const SPLIT_POSES={catdance:'assets/poses/split_catdance.webp',ballet:'assets/poses/split_ballet.webp'};
const CART_SHEETS={pink:'assets/poses/cart_pink.webp',ballet:'assets/poses/cart_ballet.webp',catdance:'assets/poses/cart_catdance.webp'};
let walkTimer=null, walkAt=0;
function startWalker(){ clearTimeout(walkTimer); walkAt=0; const w=$('#rubyWalker'); if(!w) return; placeWalker(WALK_PTS[0],0); walkTimer=setTimeout(walkStep,2500); }
function placeWalker([x,y],ms){ const w=$('#rubyWalker'); w.style.transitionDuration=ms+'ms'; w.style.left=x/W*100+'%'; w.style.top=y/H*100+'%'; w.style.height=(15+(y-400)/130*2.5)+'%'; }
function walkStep(){ const w=$('#rubyWalker'); if(!w||!document.body.contains(w)) return;
  if(document.querySelector('.panel.on, .ov.on, #town-night')){ walkTimer=setTimeout(walkStep,3000); return; }
  let n; do{ n=Math.floor(Math.random()*WALK_PTS.length); }while(n===walkAt); const [x0,y0]=WALK_PTS[walkAt], [x1,y1]=WALK_PTS[n]; walkAt=n;
  const ms=Math.hypot(x1-x0,(y1-y0)*1.6)/70*1000; w.classList.add('walk'); placeWalker([x1,y1],ms);
  walkTimer=setTimeout(async()=>{ w.classList.remove('walk'); if(Math.random()<.6) await trick(x1<x0?-1:1); walkTimer=setTimeout(walkStep,1500+Math.random()*2500); },ms); }
function cartwheel(dir){ return new Promise(res=>{ const w=$('#rubyWalker'), img=$('#rubyOnMap'); const sheet=CART_SHEETS[T.outfit]; if(!w||!img||!sheet) return res();
  const d=document.createElement('div'); d.className='cart'; d.style.cssText=`position:absolute;left:50%;bottom:0;height:86%;aspect-ratio:506/570;transform:translateX(-50%) scaleX(${dir<0?-1:1});background:url(${sheet}) 0 0/500% 100% no-repeat;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))`;
  img.style.visibility='hidden'; w.appendChild(d);
  const x0=parseFloat(w.style.left)||50, dx=dir*4.2; w.style.transitionDuration='900ms'; w.style.left=Math.max(30,Math.min(70,x0+dx))+'%';
  let f=0; const tick=setInterval(()=>{ f++; if(f>4){ clearInterval(tick); setTimeout(()=>{ d.remove(); img.style.visibility=''; res(); },350); return; } d.style.backgroundPosition=`${f*25}% 0`; },190); }); }
function trick(dir){ return new Promise(async res=>{ const img=$('#rubyOnMap'); if(!img) return res(); const splitSrc=SPLIT_POSES[T.outfit];
  const sk=(T.gym&&T.gym.done)||{}, can=id=>(sk[id]||0)>=3; const opts=(CART_SHEETS[T.outfit]&&can('cartwheel')?['cartwheel','cartwheel','cartwheel']:[]).concat(['jump','spin','wave']).concat(splitSrc&&can('split')?['split','split']:[]); const t=opts[Math.floor(Math.random()*opts.length)];
  if(t==='cartwheel'){ await cartwheel(dir); return res(); }
  if(t==='split'){ const orig=img.src; img.src=splitSrc; img.classList.add('splitpose'); setTimeout(()=>{ img.classList.remove('splitpose'); img.src=orig; res(); },2400); img.onerror=()=>{ img.onerror=null; img.src=orig; img.classList.remove('splitpose'); res(); }; return; }
  img.style.setProperty('--cw',(dir*0)+'%'); img.style.setProperty('--cr',(dir*360)+'deg');
  img.classList.add(t); const done=()=>{ img.classList.remove(t); res(); }; img.addEventListener('animationend',function f(e){ if(e.target!==img) return; img.removeEventListener('animationend',f); done(); }); setTimeout(()=>{ if(img.classList.contains(t)) done(); },3000); }); }
function bubble(el,text){ $$('.bubble').forEach(b=>b.remove()); const r=el.getBoundingClientRect(), mr=$('#map').getBoundingClientRect();
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text; b.style.left=((r.left+r.width/2-mr.left)/mr.width*100)+'%'; b.style.top=((r.top+r.height*0.25-mr.top)/mr.height*100)+'%';
  $('#map').appendChild(b); TC.speakZh(text); setTimeout(()=>b.remove(),3500); }

const NAIL_PATS=[['plain','纯色'],['glitter','闪粉'],['dots','波点'],['stripe','条纹'],['heart','爱心'],['star','星星'],['flower','小花']];
const NAILS=[{"cx":98,"cy":694,"x":33,"y":625,"w":134,"h":144,"ang":-35.1},{"cx":329,"cy":207,"x":276,"y":139,"w":107,"h":135,"ang":-5.2},{"cx":569,"cy":120,"x":512,"y":45,"w":114,"h":148,"ang":1.9},{"cx":790,"cy":220,"x":734,"y":149,"w":112,"h":142,"ang":7.3},{"cx":974,"cy":433,"x":924,"y":372,"w":101,"h":122,"ang":17.7}];
function nailSVG(d,{sel=-1,size=''}={}){
  const U='u'+(nailSVG.n=(nailSVG.n||0)+1)+'_';
  const defs=`<defs><pattern id="${U}pg" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4" fill="#fff" opacity=".9"/><circle cx="19" cy="16" r="3" fill="#FFF4B0"/><circle cx="12" cy="22" r="2" fill="#fff"/></pattern><pattern id="${U}pd" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="7" fill="#fff"/></pattern><pattern id="${U}ps" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="13" height="28" fill="#fff" opacity=".85"/></pattern>
    ${NAILS.map((n,i)=>`<mask id="${U}hn${i}" maskUnits="userSpaceOnUse" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"><image href="assets/hand/n${i}.png" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"/></mask>`).join('')}</defs>`;
  const nails=NAILS.map((n,i)=>{ const v=d[i]; const fill=v?.c; const box=`x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"`;
    const pat=v&&v.p!=='plain'?(['glitter','dots','stripe'].includes(v.p)?`<rect ${box} fill="url(#${U}${({glitter:'pg',dots:'pd',stripe:'ps'})[v.p]})"/>`:`<text x="${n.cx}" y="${n.cy+n.h*.16}" text-anchor="middle" font-size="${n.w*.5}" fill="#fff" transform="rotate(${n.ang} ${n.cx} ${n.cy})">${({heart:'♥',star:'★',flower:'✿'})[v.p]}</text>`):'';
    return `<g class="nail ${i===sel?'sel':''}" data-n="${i}" style="transform-origin:${n.cx}px ${n.cy}px">
      ${fill?`<g mask="url(#${U}hn${i})"><rect ${box} fill="${fill}"/>${pat}<ellipse cx="${n.cx-n.w*.18}" cy="${n.cy-n.h*.12}" rx="${n.w*.1}" ry="${n.h*.2}" fill="#fff" opacity=".45" transform="rotate(${n.ang} ${n.cx} ${n.cy})"/></g>`:''}
      <ellipse class="hit" cx="${n.cx}" cy="${n.cy}" rx="${n.w*.62}" ry="${n.h*.62}" fill="transparent" ${i===sel?'stroke="#E2683F" stroke-width="9" stroke-dasharray="18 10"':''} transform="rotate(${n.ang} ${n.cx} ${n.cy})"/></g>`; }).join('');
  return `<svg class="hand" viewBox="0 20 1086 1130" ${size}>${defs}<image href="assets/hand/hand.webp" width="1086" height="1448"/>${nails}</svg>`; }
let nailDraft=null, nailSel=0, nailColor=NAIL_COLORS[0], nailPat='plain';

const DENOMS=[2000,1000,500,200,100,50,20,10];
function moneyHTML(c){ const lab=c>=100?'$'+(c/100):c+'c'; return c>=500?`<div class="note c${c}" data-m="${c}">${lab}</div>`:`<div class="coin c${c}" data-m="${c}">${lab}</div>`; }
function palette(maxDen){ return `<div class="money-row">${DENOMS.filter(d=>d<=maxDen).slice().reverse().map(moneyHTML).join('')}</div>`; }
function trayHTML(list){ return list.map((c,k)=>moneyHTML(c).replace('data-m=',`data-k="${k}" data-m=`)).join(''); }
function sum(a){ return a.reduce((x,y)=>x+y,0); }
function say(t){ TC.speakZh(t); }

/* buying: pay the shopkeeper */
let payItem=null;
function startPay(item,kind){ $('#payClose').onclick=()=>openShop(); if(T.coins<item.price){ const need=item.price-T.coins; say(TC.L(`钱还不够，还差${spokenMoney(need)}。去完成任务赚钱吧！`,`Not enough money yet. You need ${spokenMoney(need)} more. Do some tasks to earn money!`)); alertBox(`钱还不够哦`,`还差 <b>${TC.fmt(need)}</b>。<br>去做今日任务、或者在杂货店当小店员赚钱吧！`); return; }
  payItem={item,kind}; const lvl=T.settings.shopLevel;
  $('#payTitle').textContent='买 '+item.zh; openPanel('#pPay');
  if(lvl===1) payExact(); else payChange(); }
function spokenMoney(c){ if(TC.lang()==='en'){ const d=Math.floor(c/100), r=c%100; return d&&r?`${d} dollars ${r}`:d?`${d} dollar${d>1?'s':''}`:`${r} cents`; } const d=Math.floor(c/100), r=c%100; return (d?d+'元':'')+(r?(r%10===0? (r/10)+'角':r+'分'):'')||'0元'; }
function itemThumb(){ const it=payItem.item; return payItem.kind==='o'?`<img src="${outfitSrc(it.id)}" style="height:170px">`:payItem.kind==='a'?`<div style="width:170px">${accHTML(it)}</div>`:payItem.kind==='n'?`<div style="width:190px">${it.svg}</div>`:`<div style="font-size:100px">${it.e}</div>`; }
function payExact(){ let tray=[]; const price=payItem.item.price;
  const draw=()=>{ $('#payBody').innerHTML=`<div style="display:flex;gap:30px;align-items:center;justify-content:center">${itemThumb()}<div><div class="muted" style="font-size:20px;font-weight:800">价格</div><div class="pricebig">${TC.fmt(price)}</div><div class="muted">钱包里有 ${TC.fmt(T.coins)}</div></div></div>
    <div style="text-align:center;font-weight:800;font-size:20px;margin-top:10px">把正好 ${TC.fmt(price)} 的钱放进托盘（点托盘里的钱可以拿回来）</div>
    <div class="tray" id="tray" style="--emp:${TC.L(`'点下面的钱放到这里'`,`'Tap the money below to put it here'`)}">${trayHTML(tray)}</div>${palette(2000)}
    <div style="text-align:center;margin-top:18px"><button class="big teal" id="payGo">付钱 ✓</button></div><div id="payMsg" style="text-align:center;font-size:20px;font-weight:800;margin-top:12px;min-height:30px"></div>`;
    $$('#payBody .money-row [data-m]').forEach(m=>m.onclick=()=>{ tray.push(+m.dataset.m); draw(); });
    $$('#tray [data-k]').forEach(m=>m.onclick=()=>{ tray.splice(+m.dataset.k,1); draw(); });
    $('#payGo').onclick=e=>{ const s=sum(tray); if(s===price){ finishBuy(e); } else { const d=Math.abs(s-price); $('#payMsg').innerHTML=`你放了 ${TC.fmt(s)}，${s>price?'多了':'少了'} <b>${TC.fmt(d)}</b>，再试试！`; say(TC.L(`${s>price?'多了':'少了'}${spokenMoney(d)}，再试试`,`${spokenMoney(d)} too ${s>price?'much':'little'}, try again`)); } }; };
  draw(); say(TC.L(`这个要${spokenMoney(price)}，请把正好的钱放进托盘`,`This costs ${spokenMoney(price)}. Put the exact money on the tray.`)); }
function payWith(price){ for(const n of [500,1000,2000,5000]) if(n>=price) return n; return Math.ceil(price/1000)*1000; }
function payChange(){ const price=payItem.item.price, paid=payWith(price), change=paid-price; const lvl=T.settings.shopLevel;
  const opts=new Set([change]); const steps=[10,20,50,100,200]; while(opts.size<4){ const d=steps[Math.floor(Math.random()*steps.length)]*(Math.random()<.5?-1:1); const v=change+d; if(v>0&&v<paid) opts.add(v); }
  const list=[...opts].sort(()=>Math.random()-.5);
  $('#payBody').innerHTML=`<div style="display:flex;gap:30px;align-items:center;justify-content:center">${itemThumb()}<div><div class="muted" style="font-size:20px;font-weight:800">价格</div><div class="pricebig">${TC.fmt(price)}</div></div><div style="font-size:24px;font-weight:900">你给店长 ${moneyHTML(paid)}</div></div>
   <div style="text-align:center;font-weight:900;font-size:26px;margin:24px 0">店长应该找你多少钱？</div>
   ${lvl>=3?`<div class="tray" id="tray" style="--emp:${TC.L(`'点下面的钱放到这里'`,`'Tap the money below to put it here'`)}"></div>${palette(1000)}<div style="text-align:center;margin-top:16px"><button class="big teal" id="chk">就是这些 ✓</button></div>`:`<div class="money-row" style="gap:18px">${list.map(v=>`<button class="opt" data-v="${v}">${TC.fmt(v)}</button>`).join('')}</div>`}
   <div id="payMsg" style="text-align:center;font-size:20px;font-weight:800;margin-top:16px;min-height:30px"></div>`;
  say(TC.L(`这个要${spokenMoney(price)}，你给了${spokenMoney(paid)}，应该找你多少钱？`,`This costs ${spokenMoney(price)} and you paid ${spokenMoney(paid)}. How much change should you get?`));
  if(lvl>=3){ let tray=[]; const draw=()=>{ $('#tray').innerHTML=trayHTML(tray); $$('#tray [data-k]').forEach(m=>m.onclick=()=>{ tray.splice(+m.dataset.k,1); draw(); }); };
    $$('#payBody .money-row [data-m]').forEach(m=>m.onclick=()=>{ tray.push(+m.dataset.m); draw(); });
    $('#chk').onclick=e=>{ const s=sum(tray); if(s===change) finishBuy(e); else { $('#payMsg').textContent=`不对哦，${s>change?'多了':'少了'}，再算算！`; say('再算算'); } }; }
  else $$('#payBody .opt').forEach(b=>b.onclick=e=>{ if(+b.dataset.v===change){ b.classList.add('right'); finishBuy(e); } else { b.classList.add('wrong'); $('#payMsg').textContent='再算算！提示：从 '+TC.fmt(price)+' 往上数到 '+TC.fmt(paid); say('再算算'); } }); }
async function finishBuy(e){ const {item,kind}=payItem; if(!TC.spend(item.price,'买 '+item.zh)) return; if(kind==='o'){ T.owned.push(item.id); T.outfit=item.id; } else if(kind==='a'){ T.acc=T.acc||[]; T.acc.push(item.id); } else if(kind==='n'){ T.nails=T.nails||[]; T.nails.push({d:nailDraft,day:TC.today()}); T.nailNow=T.nails.length-1; nailDraft=null; } else T.decor.push(item.id); await TC.saveNow();
  burst(e.clientX,e.clientY,['sparkle','heart','coin','star'],16);
  $('#payBody').innerHTML=`<div style="text-align:center;padding-top:20px">${kind==='o'?`<img src="${outfitSrc(item.id)}" style="height:420px;animation:popin .7s cubic-bezier(.3,1.6,.5,1)">`:kind==='a'?`<div style="width:260px;margin:auto;animation:popin .7s">${accHTML(item)}</div>`:kind==='n'?`<div style="width:300px;margin:auto;animation:popin .7s">${item.svg}</div>`:`<div style="font-size:160px;animation:popin .7s">${item.e}</div>`}<h2 style="font-size:36px;margin:10px 0">${kind==='n'?'美甲做好啦！':'买到啦！'+esc(item.zh)}</h2>${kind==='o'?'<div class="muted" style="font-size:20px">已经帮你换上了</div>':kind==='a'?'<div class="muted" style="font-size:20px">放进首饰盒啦</div>':kind==='n'?'<div class="muted" style="font-size:20px">放进美甲相册啦</div>':'<div class="muted" style="font-size:20px">放到宠物乐园啦</div>'}<button class="big teal" style="margin-top:20px" id="payDone">好耶！</button></div>`;
  say(TC.L(kind==='o'?`买到啦！${item.zh}，已经帮你换上了！`:kind==='a'?`买到啦！${item.zh}放进首饰盒了`:kind==='n'?'美甲做好啦，真漂亮！':`买到啦！${item.zh}放到宠物乐园了`,kind==='o'?`You bought it! You're wearing it now!`:kind==='a'?`You bought it! It's in your jewellery box.`:kind==='n'?'Your nails are done. So pretty!':`You bought it! It's in the Pet Park now.`));
  $('#payDone').onclick=()=>{ if(!TC.guard()) openShop(); }; }
$('#payClose').onclick=()=>openShop();
function alertBox(title,html,after){ openPanel('#pPay'); $('#payTitle').textContent=title; $('#payBody').innerHTML=`<div style="text-align:center;font-size:24px;line-height:1.7;padding-top:40px">${html}<div><button class="big teal" style="margin-top:24px" id="ab">好的</button></div></div>`; $('#ab').onclick=()=>(after||openShop)(); $('#payClose').onclick=()=>(after||openShop)(); }

/* cashier mode: earn money by giving change */
const grHTML=i=>`<i class="gr" style="background-position:${(i%4)*100/3}% ${Math.floor(i/4)*50}%"></i>`;
const GOODS=['苹果','香蕉','胡萝卜','面包','奶酪','牛奶','饼干','草莓','鸡蛋','蜂蜜','玉米','西瓜'].map((n,i)=>[grHTML(i),n]);
function workIntro(){ $('#shopBody').innerHTML=`<div style="text-align:center;padding-top:30px"><div style="font-size:90px">${TC.icon('basket','big')}</div><h2 style="font-size:32px">帮店长卖东西！</h2><p style="font-size:21px;line-height:1.7">小动物们来买东西，<br>你要算出该找多少钱，把零钱给它们。<br>一轮 5 位客人，每找对一次赚 <b>30c</b>，全对再奖励 <b>50c</b>！</p><button class="big coral" id="workGo">开始营业 ▶</button></div>`; $('#workGo').onclick=()=>{ if(!TC.guard()) startWork(); }; }
let W_=null;
function genCustomer(){ const lvl=T.settings.shopLevel; const g=()=>GOODS[Math.floor(Math.random()*GOODS.length)]; let items, price, paid;
  if(lvl===1){ items=[g()]; price=(1+Math.floor(Math.random()*8))*100; paid=1000; }
  else if(lvl===2){ items=[g()]; price=110+Math.floor(Math.random()*88)*10; paid=price>1000?2000:1000; if(Math.random()<.3&&price<=500){ paid=500; } }
  else { items=[g(),g()]; const a=60+Math.floor(Math.random()*60)*10, b=60+Math.floor(Math.random()*60)*10; items[0].p=a; items[1].p=b; price=a+b; paid=payWith(price); if(paid===price) paid+=1000; }
  const pool=T.animals.length?T.animals:[0,1,2,3]; const who=pool[Math.floor(Math.random()*pool.length)];
  return {items,price,paid,change:paid-price,who,tries:0}; }
function startWork(){ W_={k:0,n:5,ok:0,earned:0,cur:genCustomer()}; drawWork(); }
function drawWork(){ const c=W_.cur, A=ANIMALS[c.who]; let tray=[];
  const GEN={'苹果':'an apple','香蕉':'a banana','胡萝卜':'a carrot','面包':'some bread','奶酪':'some cheese','牛奶':'some milk','饼干':'a cookie','草莓':'a strawberry','鸡蛋':'an egg','蜂蜜':'some honey','玉米':'a corn cob','西瓜':'a watermelon'};
  const nm=x=>TC.L(x[1],GEN[x[1]]||x[1]);
  const itemsTxt=c.items.length===1?`${c.items[0][0]} ${nm(c.items[0])}`:c.items.map(x=>`${x[0]} ${nm(x)} ${TC.fmt(x.p)}`).join(' + ');
  const render=()=>{ $('#shopBody').innerHTML=`<div class="dots" style="margin-bottom:16px">${Array.from({length:W_.n},(_,k)=>`<i class="${k<W_.k?'ok':k===W_.k?'cur':''}"></i>`).join('')}</div>
   <div class="customer"><div class="av"><i style="${TC.animalStyle(c.who)}"></i></div><div class="say" data-zh>${TC.L(`我是${esc(A.zh)}，我要买 ${itemsTxt}。`,`I'm ${esc(A.en)}. I'd like ${itemsTxt}.`)}<br>${TC.L(c.items.length>1?'一共':'价格','That\'s')} <b style="color:#C77700">${TC.fmt(c.price)}</b>${TC.L('，我给你',' and I\'ll give you')} ${moneyHTML(c.paid).replace('class="','style="display:inline-flex;vertical-align:middle;transform:scale(.8)" class="')}</div></div>
   <div style="text-align:center;font-weight:900;font-size:22px;margin-top:16px" data-zh>${TC.L(`找给${esc(A.zh)}多少零钱？把零钱放进托盘`,`How much change for ${esc(A.en)}? Put it on the tray`)}</div>
   <div class="tray" id="tray" style="--emp:${TC.L(`'点下面的钱放到这里'`,`'Tap the money below to put it here'`)}">${trayHTML(tray)}</div>${palette(c.paid>1000?1000:500)}
   <div style="text-align:center;margin-top:14px"><button class="big teal" id="give">给零钱 ✓</button></div><div id="wMsg" style="text-align:center;font-size:20px;font-weight:800;margin-top:10px;min-height:30px"></div>`;
   $$('#shopBody .money-row [data-m]').forEach(m=>m.onclick=()=>{ tray.push(+m.dataset.m); render(); });
   $$('#tray [data-k]').forEach(m=>m.onclick=()=>{ tray.splice(+m.dataset.k,1); render(); });
   $('#give').onclick=e=>{ const s=sum(tray); c.tries++;
     if(s===c.change){ const pay=c.tries===1?30:15; W_.earned+=pay; if(c.tries===1) W_.ok++; burst(e.clientX,e.clientY,['coin','sparkle'],8); say('谢谢你！'); W_.k++;
       if(W_.k>=W_.n) return endWork(); W_.cur=genCustomer(); setTimeout(drawWork,700); }
     else { $('#wMsg').innerHTML=`${s>c.change?'多了':'少了'} ${TC.fmt(Math.abs(s-c.change))}，再试一次！<span class="muted">（从 ${TC.fmt(c.price)} 往上数到 ${TC.fmt(c.paid)}）</span>`; say(s>c.change?'多了，再试一次':'少了，再试一次'); if(c.tries>=3){ $('#wMsg').innerHTML+=`<br>答案是 ${TC.fmt(c.change)}`; } } }; };
  render(); say(TC.L(`我要买${c.items.map(x=>x[1]).join('和')}，${spokenMoney(c.price)}，我给你${spokenMoney(c.paid)}`,`I'd like ${c.items.map(x=>(window.I18N_EN&&I18N_EN.exact[x[1]])||x[1]).join(' and ')}. That's ${spokenMoney(c.price)}, and here's ${spokenMoney(c.paid)}.`)); }
async function endWork(){ let bonusAll=W_.ok===W_.n?50:0; const total=W_.earned+bonusAll; TC.earn(total,'杂货店当小店员'); const r=TC.taskDone('shop'); await TC.saveNow();
  $('#shopCoins').innerHTML=TC.icon('coin')+' '+TC.fmt(T.coins);
  $('#shopBody').innerHTML=`<div style="text-align:center;padding-top:10px"><img src="assets/ruby_cheer.webp" style="height:300px"><h2 style="font-size:34px;margin:8px 0">营业结束！赚了 ${TC.fmt(total)}</h2><div style="font-size:20px">${W_.ok}/${W_.n} 位客人一次就找对${bonusAll?'，全对奖励 50c！':''}</div>${r.allDoneNow?`<div style="font-size:22px;font-weight:900;color:#E2683F;margin-top:10px">今天的任务全部完成！奖励 ${TC.fmt(r.bonus)} + 1 个印章</div>`:''}<div style="margin-top:20px;display:flex;gap:14px;justify-content:center"><button class="big coral" id="again">再来一轮</button><button class="big white" id="toTown">回小镇</button></div></div>`;
  burst(innerWidth/2,innerHeight/3,['coin','star','sparkle'],20); say(`营业结束！你赚了${spokenMoney(total)}`+(r.allDoneNow?'，今天的任务全部完成啦！':''));
  $('#again').onclick=()=>TC.afterReward(()=>startWork()); $('#toTown').onclick=()=>TC.afterReward(()=>closePanels()); }

/* ---- one shared setting per game: the quick − / + here edits exactly what each game's detail page edits ---- */
const TABLE_ORDER=[2,5,10,3,4,6,7,8,9];
function spellMixLabel(sv){ const base=Math.floor(sv/6), ex=sv%6, c={}; for(let i=0;i<6;i++){ const l=i<6-ex?base:base+1; c[l]=(c[l]||0)+1; } return Object.keys(c).map(l=>`L${l}×${c[l]}`).join(' + '); }
function spellDiff(S){ return S.diff!=null?S.diff:((S.sessions||[]).length?9:Math.max(6,Math.min(24,6*(S.level||2)-3))); }
function spellAdj(delta){ return new Promise(res=>{ try{ const r=indexedDB.open('spellingpals'); r.onsuccess=()=>{ const db=r.result; if(!db.objectStoreNames.contains('kv')){ db.close(); return res(); }
  const tx=db.transaction('kv','readwrite'), st=tx.objectStore('kv'), q=st.get('state'); q.onsuccess=()=>{ const S=q.result; if(S){ S.diff=Math.max(6,Math.min(24,spellDiff(S)+delta)); S.level=Math.ceil(S.diff/6); S.mixChal=false; st.put(S,'state'); } };
  tx.oncomplete=()=>{ db.close(); res(); }; tx.onerror=()=>res(); }; r.onerror=()=>res(); }catch(e){ res(); } }); }
const ADJ={
  spell:async d=>{ await spellAdj(d); },
  mul:d=>{ const B=T.bake; if(!B) return; if(d>0){ const nt=TABLE_ORDER.find(t=>!B.tables.includes(t)); if(nt) B.tables.push(nt); } else if(B.tables.length>1){ const last=[...TABLE_ORDER].reverse().find(t=>B.tables.includes(t)); B.tables=B.tables.filter(t=>t!==last); } },
  time:d=>{ const B=T.bake; if(!B) return; B.time.lv=Math.max(1,Math.min(5,B.time.lv+d)); B.time.streak=0; },
  frac:d=>{ const B=T.bake; if(!B) return; B.frac.lv=Math.max(1,Math.min(5,B.frac.lv+d)); B.frac.streak=0; },
  shop:d=>{ T.settings.shopLevel=Math.max(1,Math.min(3,T.settings.shopLevel+d)); } };
document.addEventListener('click',async e=>{ const b=e.target.closest('[data-adj]'); if(!b) return; const [k,d]=b.dataset.adj.split(':'); await ADJ[k](+d); await TC.saveNow(); savedToast(); refreshReport(); });
const MOODS_E=Array.from({length:10},(_,k)=>`<i class="mood" style="background-position:${(k%5)*25}% ${Math.floor(k/5)*100}%"></i>`);
function diaryParent(){ const list=T.diary.slice(-14).reverse(); if(!list.length) return '<div class="muted">还没有日记。天黑后（或时间用完的晚安画面里）她可以进小屋写。</div>';
  const unread=T.notes.filter(n=>!n.read).length;
  return (unread?`<div class="muted" style="margin-bottom:8px">还有 ${unread} 张小纸条她没看到（下次进小屋会在枕头边出现）</div>`:'')+list.map(e=>e.shared?`<div style="border-bottom:1px solid #F1EAE2;padding:10px 0"><div class="muted">${e.d} · ${MOODS_E[e.mood]||''} · ${e.words||0} 词</div><div style="font:18px/1.6 'Chalkboard SE','Comic Sans MS',sans-serif;white-space:pre-wrap;margin:6px 0">${esc(e.text)}</div><div style="display:flex;gap:8px"><input type="text" placeholder="给她写一句回信，明晚出现在枕头边" data-reply="${e.ts}" style="flex:1;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid #EDE3D8"><button class="btn" data-send="${e.ts}">寄出</button></div></div>`:`<div style="border-bottom:1px solid #F1EAE2;padding:10px 0" class="muted">${e.d} · ${MOODS_E[e.mood]||''} · 一篇只给自己看的日记（${e.words||0} 词）</div>`).join('')
   + `<div style="margin-top:10px;display:flex;gap:8px"><input type="text" id="freeNote" placeholder="或者随便给她写张小纸条" style="flex:1;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid #EDE3D8"><button class="btn" id="sendFree">寄出</button></div>`; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-send],#sendFree'); if(!b) return;
  let text, about=''; if(b.id==='sendFree'){ text=$('#freeNote').value.trim(); } else { const ts=b.dataset.send; text=document.querySelector(`[data-reply="${ts}"]`).value.trim(); about=(T.diary.find(x=>String(x.ts)===ts)||{}).d||''; }
  if(!text) return; T.notes.push({d:TC.today(),ts:Date.now(),text,about,read:false}); TC.save(); b.textContent='已寄出 ✓'; b.disabled=true; if($('#dpBack')) setTimeout(()=>openDiaryParent(false),500); });

/* ---------- parent: today's learning report ---------- */
function spellState(){ return new Promise(res=>{ try{ const r=indexedDB.open('spellingpals'); r.onerror=()=>res(null);
  r.onupgradeneeded=()=>{ r.transaction.abort(); res(null); };
  r.onsuccess=()=>{ const db=r.result; if(!db.objectStoreNames.contains('kv')){ db.close(); return res(null); } const q=db.transaction('kv').objectStore('kv').get('state'); q.onsuccess=()=>{ res(q.result||null); db.close(); }; q.onerror=()=>res(null); }; }catch(e){ res(null); } }); }
const TIME_LV=['','整点','半点','一刻钟','五分钟','烤多久（经过时间）'], FR_LV=['','一半（二分之一）','二分之一和四分之一','几分之一（2/3/4）','几分之几','比大小'], SHOP_LV=['','整元，从 $10 找零','元和角','两样相加再找零'];
async function todayReport(){ const d=TC.today(); const rows=[]; const ab=(k,lo,hi,v)=>`<span class="adj"><button data-adj="${k}:-1" ${v<=lo?'disabled':''}>−</button><button data-adj="${k}:1" ${v>=hi?'disabled':''}>+</button></span>`;
  const S=await spellState();
  if(S){ const ss=(S.sessions||[]).filter(x=>x.date===d); const it=ss.flatMap(x=>x.items); const dv=spellDiff(S); const el=$('#dWords'); if(el) el.textContent=Object.values(S.words||{}).filter(W=>W.mastered).length;
    rows.push(['拼单词', ss.length?`${ss.length} 组 · ${it.length} 个词 · 写对 ${it.filter(i=>i.ok).length}${it.some(i=>!i.ok)?` · 错：${it.filter(i=>!i.ok).map(i=>esc(i.w)).join(', ')}`:''}`:'今天没玩', `混合出题 ${spellMixLabel(dv)}`, ab('spell',6,24,dv), '图书馆/拼写.html#parent']); }
  else { rows.push(['拼单词','还没开始玩','','', '图书馆/拼写.html#parent']); const el=$('#dWords'); if(el) el.textContent='0'; }
  const Z=T.zh||{}; const ch=Object.entries(Z.chars||{}); const books=Object.entries(Z.books||{}).filter(([k,v])=>v.passed===d).map(([k])=>(window.BOOKS_T||{})[k]||('第'+k+'本'));
  const newL=ch.filter(([c,s])=>s.learnedOn===d).map(([c])=>c), newK=ch.filter(([c,s])=>s.knownOn===d).length, known=ch.filter(([c,s])=>s.known).length;
  rows.push(['书院认字', (newL.length||books.length||newK)?`${books.length?`读通 ${books.join('、')} · `:''}新学 ${newL.length} 字${newL.length?`（${newL.join('')}）`:''} · 新认识 ${newK} 字`:'今天没玩', `共认识 ${known} 字（按复习自动安排）`, '', '书院/认字.html#parent']);
  const Bk=T.bake||{tables:[2,5,10],time:{lv:1},frac:{lv:1},sessions:[]}; const bs=(Bk.sessions||[]).filter(x=>x.d===d);
  const by=k=>{ const ss=bs.filter(x=>k.includes(x.kind)); const its=ss.flatMap(x=>x.items); return its.length?`${its.filter(i=>i.ok).length}/${its.length} 一次做对`:'今天没玩'; };
  rows.push(['面包店 · 乘除', by(['mul','div','mix']), `乘法表 ×${Bk.tables.slice().sort((a,b)=>a-b).join(' ×')}`, ab('mul',1,9,Bk.tables.length), '面包店/烘焙.html#parent']);
  rows.push(['面包店 · 看时间', by(['time']), `第 ${Bk.time.lv} 关：${TIME_LV[Bk.time.lv]}`, ab('time',1,5,Bk.time.lv), '面包店/烘焙.html#parent']);
  rows.push(['面包店 · 分数', by(['frac']), `第 ${Bk.frac.lv} 关：${FR_LV[Bk.frac.lv]}`, ab('frac',1,5,Bk.frac.lv), '面包店/烘焙.html#parent']);
  const sh=(T.ledger||[]).filter(l=>l.d===d&&/找零|小店员|营业/.test(l.why)&&!/面包店/.test(l.why));
  rows.push(['杂货店当店员', sh.length?`当店员 ${sh.length} 轮`:'今天没当店员', `${T.settings.shopLevel} 级：${SHOP_LV[T.settings.shopLevel]}`, ab('shop',1,3,T.settings.shopLevel), '']);
  const gy=(T.ledger||[]).filter(l=>l.d===d&&/健身房/.test(l.why)).length; rows.push(['健身房', gy?`锻炼了 ${gy} 次`:'今天没去', `练成 ${Object.values((T.gym||{}).done||{}).filter(v=>v>=3).length} 个动作`, '', '']);
  const dy=(T.diary||[]).find(e=>e.d===d); const waiting=(T.diary||[]).filter(e=>e.shared&&!(T.notes||[]).some(n=>n.about===e.d)).length;
  rows.push(['日记', dy?`写了 ${dy.words||0} 个词${dy.shared?' · 给妈妈看了':' · 只给自己看'}`:'今天还没写', waiting?`<b style="color:#E2683F">${waiting} 篇等你回信</b>`:'都回过了', `<button class="btn" data-diary="reply">回信</button>`, 'diary']);
  return `<table class="rep rep2"><tr><th>游戏</th><th>今天</th><th>现在的难度</th><th>调整</th><th></th></tr>${rows.map(r=>`<tr><td style="white-space:nowrap;font-weight:900">${r[0]}</td><td>${r[1]}</td><td class="muted">${r[2]}</td><td>${r[3]}</td><td>${r[4]==='diary'?`<button class="btn ghost" data-diary="all">详情 →</button>`:r[4]?`<button class="btn ghost" data-goto="${r[4]}">详情 →</button>`:''}</td></tr>`).join('')}</table>`; }

  const e=q[0]; const name=T.childName||TC.L('小朋友','friend');
  o.innerHTML=`<div class="lfwrap"><div class="envw" id="envw"><div class="flap"></div>${ENV_SVG}<div class="seal">${TC.icon('heart')}</div><div class="mini"></div></div>
    <div class="paper" id="pp"><div class="ph"><span>${e.d}</span><span>${MOODS_E[e.mood]||''}</span></div><div class="pt">${esc(e.text)}</div><div class="pf">— ${esc(name)}</div>
      <div class="pbtn"><button class="btn ghost" id="lfClose">先不回</button><button class="btn" id="lfWrite">写回信</button></div></div>
    <div class="paper mum" id="pw"><div class="ph"><span>给 ${esc(name)} 的回信</span><span>${TC.today()}</span></div><textarea id="lfText" placeholder="亲爱的 ${esc(name)}："></textarea>
      <div class="pbtn"><button class="btn ghost" id="lfBack">再看看她的信</button><button class="btn" id="lfSend">寄出</button></div></div>
    <div class="lfmsg" id="lfMsg"></div></div>`;
  const step=(c,ms)=>new Promise(r=>setTimeout(()=>{ o.classList.add(c); r(); },ms));
  requestAnimationFrame(async()=>{ o.classList.add('in'); await step('open',600); await step('rise',600); await step('read',650); });
  $('#lfClose').onclick=()=>{ o.classList.add('bye'); setTimeout(()=>o.remove(),350); };
  $('#lfWrite').onclick=()=>{ o.classList.add('write'); setTimeout(()=>$('#lfText').focus(),450); };
  $('#lfBack').onclick=()=>o.classList.remove('write');
  $('#lfSend').onclick=async()=>{ const text=$('#lfText').value.trim(); if(!text){ $('#lfText').focus(); return; }
    T.notes=T.notes||[]; T.notes.push({d:TC.today(),ts:Date.now(),text,about:e.d,read:false}); await TC.saveNow();
    o.classList.add('fold'); await new Promise(r=>setTimeout(r,700)); o.classList.add('seal2'); await new Promise(r=>setTimeout(r,650)); o.classList.add('fly'); await new Promise(r=>setTimeout(r,900));
    const left=waitingLetters().length; $('#lfMsg').innerHTML=`寄出啦！她下次打开游戏就会收到。${left?`<br>还有 ${left} 封信等你回`:''}<div class="pbtn" style="justify-content:center">${left?'<button class="btn" id="lfNext">下一封</button>':''}<button class="btn ghost" id="lfDone">好的</button></div>`;
    o.classList.add('done'); $('#lfDone').onclick=()=>{ o.remove(); refreshReport(); }; if($('#lfNext')) $('#lfNext').onclick=()=>{ o.remove(); replyFlow(); }; }; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-diary]'); if(!b) return; if(b.dataset.diary==='reply') replyFlow(); else openDiaryParent(); });
function savedToast(msg){ $$('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg||'✓ 已保存'; document.body.appendChild(t); setTimeout(()=>t.remove(),1400); }
document.addEventListener('change',e=>{ if(e.target.closest('#pParent')) savedToast(); });
document.addEventListener('click',e=>{ const g=e.target.closest('[data-goto]'); if(g){ try{ sessionStorage.setItem('parentOK',String(Date.now())); sessionStorage.setItem('parentFrom','hub'); }catch(x){} location.href=g.dataset.goto; } });
window.openParentFromNight=()=>{ openParent(); };


/* ---------- opening animation ---------- */
function playIntro(){ return new Promise(res=>{ const el=$('#intro'); let seen=false; try{ seen=sessionStorage.getItem('mlt_intro')==='1'; sessionStorage.setItem('mlt_intro','1'); }catch(e){}
  if(seen){ el.remove(); return res(); }
  const W=innerWidth,H=innerHeight; let h='';
  for(let i=0;i<34;i++){ const left=i%2===0; const w=(.25+Math.random()*.35)*W, hh=w*(.45+Math.random()*.25); const x=(left?-.15:.45)*W+Math.random()*.7*W*.6, y=Math.random()*H-hh/3;
    h+=`<div class="cl ${x+w/2<W/2?'l':'r'}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;opacity:${.85+Math.random()*.15}"></div>`; }
  el.insertAdjacentHTML('afterbegin',h);
  const open=()=>{ if(el.classList.contains('open')) return; el.classList.add('open'); $('#map').classList.add('zoomin'); setTimeout(()=>{ el.remove(); res(); },2300); };
  el.onclick=open; setTimeout(open,1900); }); }

/* ---------- first-time setup: language, name, age ---------- */
const SETUP_AGE={5:{sp:1,tb:[2,10],seed:false,tl:1,shop:1},6:{sp:1,tb:[2,5,10],seed:false,tl:1,shop:1},7:{sp:2,tb:[2,5,10],seed:true,tl:1,shop:1},8:{sp:3,tb:[2,5,10,3,4],seed:true,tl:2,shop:2},9:{sp:3,tb:[2,5,10,3,4,6],seed:true,tl:3,shop:2},10:{sp:4,tb:[2,5,10,3,4,6,7,8,9],seed:true,tl:4,shop:3}};
function runSetup(){ return new Promise(res=>{ if(T.setupDone||window.__skipSetup) return res(); const box=$('#setup'), card=$('#setupCard'); let step=0; const ans={lang:TC.lang(),name:T.childName||'',age:7};
  const dots=n=>`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i===n?'on':''}"></i>`).join('')}</div>`;
  const draw=()=>{ if(step===0){ card.innerHTML=`<div style="font-size:64px">${TC.icon('home','big')}</div><h2>Welcome to My Little Town!</h2><div class="sub">欢迎来到动物小镇！ Which language do you like?</div>
      <div class="opts"><div class="opt" data-l="en">English<small>Instructions in English</small></div><div class="opt" data-l="zh">中文<small>提示用中文</small></div></div>${dots(0)}`;
      card.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ ans.lang=b.dataset.l; step=1; draw(); }); TC.speak('Welcome to My Little Town! Which language do you like?','en-NZ'); }
    else if(step===1){ const en=ans.lang==='en'; card.innerHTML=`<div style="font-size:64px">${TC.icon('pencil','big')}</div><h2>${en?"What's your name?":'你叫什么名字？'}</h2><div class="sub">${en?'The animals will call you this.':'小镇的动物们会这样叫你。'}</div>
      <input id="nm" value="${esc(ans.name)}" maxlength="16"><div style="margin-top:20px"><button class="big coral" id="nx">${en?'Next →':'下一步 →'}</button></div>${dots(1)}`;
      $('#nm').focus(); $('#nx').onclick=()=>{ ans.name=$('#nm').value.trim()||TC.L('小朋友','friend'); step=2; draw(); }; TC.speak(en?"What's your name?":'你叫什么名字？',en?'en-NZ':'zh-CN'); }
    else if(step===2){ const en=ans.lang==='en'; card.innerHTML=`<div style="font-size:64px">${TC.icon('cupcake','big')}</div><h2>${en?`How old are you, ${esc(ans.name)}?`:`${esc(ans.name)}，你几岁啦？`}</h2><div class="sub">${en?'So the games start at the right level.':'这样游戏会从合适的难度开始。'}</div>
      <div class="opts">${[5,6,7,8,9,10].map(a=>`<div class="opt" data-a="${a}">${a}${a===10?'+':''}</div>`).join('')}</div>${dots(2)}`;
      card.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ ans.age=+b.dataset.a; step=3; draw(); }); TC.speak(en?`How old are you, ${ans.name}?`:`${ans.name}，你几岁啦？`,en?'en-NZ':'zh-CN'); }
    else { const en=ans.lang==='en'; card.innerHTML=`<div style="font-size:64px">${TC.icon('book','big')}</div><h2>${en?'Do you know any Chinese characters?':'你认识汉字吗？'}</h2><div class="sub">${en?'For the Chinese School. A grown-up can help answer.':'书院会从合适的书开始。可以请爸爸妈妈帮你选。'}</div>
      <div class="opts"><div class="opt" data-z="starter">${en?'Not yet':'还不认识'}<small>${en?'Start with the starter books':'从启蒙小书开始'}</small></div><div class="opt" data-z="book1">${en?'Yes, some':'认识一些'}<small>${en?'I can read simple stories':'能读简单的小故事'}</small></div></div>${dots(3)}`;
      card.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ ans.zh=b.dataset.z; finish(); }); TC.speak(en?'Do you know any Chinese characters?':'你认识汉字吗？',en?'en-NZ':'zh-CN'); } };
  const finish=async()=>{ const P=SETUP_AGE[ans.age]; T.childName=ans.name; T.settings.age=ans.age; T.setupDone=TC.today(); if(ans.zh) T.zhStart=ans.zh;
    if(!T.bake){ T.bake={facts:{},tables:P.tb.slice(),treats:[],sessions:[],time:{lv:P.tl,streak:0},frac:{lv:1,streak:0},seeded:!P.seed}; }
    if(!T.shopSetByAge){ T.settings.shopLevel=P.shop; T.shopSetByAge=1; }
    await setSpellLevel(P.sp);
    const changed=ans.lang!==TC.lang(); TC.setLang(ans.lang); await TC.saveNow(); box.classList.remove('on');
    if(changed){ location.reload(); return; } res(); };
  box.classList.add('on'); draw(); }); }
function setSpellLevel(lv){ return new Promise(res=>{ try{ const r=indexedDB.open('spellingpals',1); r.onupgradeneeded=()=>{ ['kv','photos','audio'].forEach(s=>{ if(!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); }); };
  r.onsuccess=()=>{ const db=r.result; const tx=db.transaction('kv','readwrite'); const st=tx.objectStore('kv'); const q=st.get('state'); q.onsuccess=()=>{ const S=q.result; if(S){ if(!(S.sessions||[]).length){ S.level=lv; st.put(S,'state'); } } else { st.put({pendingLevel:lv},'pendingLevel'); } }; tx.oncomplete=()=>{ db.close(); res(); }; tx.onerror=()=>res(); }; r.onerror=()=>res(); }catch(e){ res(); } }); }

  <div class="tag">${L('一个妈妈为女儿做的学习小镇：拼单词、认汉字、做数学、跳舞健身、写日记。','A learning town a mum made for her daughter: spelling, Chinese characters, maths, dance and fitness, and a diary.')}</div>

function openAbout(){ $('#aboutBody').innerHTML=aboutHTML(); $('#aboutPane').classList.add('on'); }
function closeAbout(){ $('#aboutPane').classList.remove('on'); }
/* ---------- boot ---------- */
(async()=>{ T=await TC.ready; buildMap(); hud(); TC.startTimer(); T.notes=T.notes||[]; mailBadge();
  $('#mailBtn').onclick=openMail; $('#aboutBtn').onclick=openAbout; $('#aboutPane .bd').onclick=closeAbout; $('#aboutPane .x').onclick=closeAbout;
  if(location.hash==='#parent'){ history.replaceState(null,'',location.pathname); let ok=false; try{ ok=Date.now()-(+sessionStorage.getItem('parentOK')||0)<60000; sessionStorage.removeItem('parentOK'); }catch(e){} if(ok||await TC.askPin()){ try{ sessionStorage.setItem('mlt_intro','1'); }catch(e){} $('#intro')?.remove(); openParent(); return; } }
  $('#langBtn').onclick=()=>{ TC.setLang(TC.lang()==='en'?'zh':'en'); TC.saveNow().then(()=>location.reload()); };
  $('#langBtn').textContent=TC.lang()==='en'?'中文':'English';
  await playIntro();
  await runSetup();
  if(TC.guard()) return;
  const firstToday=T.taskSeen!==TC.today();
  if(firstToday && !T.welcomeGift){ T.taskSeen=TC.today(); TC.save(); setTimeout(()=>{ openTasks(true); },900); }
  else setTimeout(mailPopup, T.welcomeGift?4000:1200);
  if(T.welcomeGift){ T.welcomeGift=false; TC.save(); setTimeout(()=>{ alertBox('欢迎来到动物小镇！',`镇长送你 <b>$10.00</b> 见面礼！<br>点房子就能进去玩：图书馆拼单词、杂货店买衣服和赚钱、<br>我的家换衣服、宠物乐园看小动物。<br>先去广场的公告栏看看今天的任务吧！`,()=>closePanels()); TC.speakZh('欢迎来到动物小镇！镇长送你十块钱见面礼！'); },600); }
  if(location.hash==='#park') openPark(); if(location.hash==='#home') openHome();
  if(location.hash==='#shop') openShop('work');
})();
